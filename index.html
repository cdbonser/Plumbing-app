<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Central Plumbing</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Central Plumbing"><link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--b:#D7262E;--bd:#111;--bg:#f4f4f5;--c:#fff;--t:#1d2733;--m:#66768a;--l:#dde3ea}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--bd);color:#fff;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}nav{display:flex;gap:4px;overflow-x:auto;background:#1f1f1f;padding:6px;border-bottom:3px solid var(--b)}
nav button{background:none;border:0;color:#e6e6e6;padding:8px 12px;border-radius:6px;font-size:14px;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--b);color:#fff;font-weight:700}
main{max-width:1100px;margin:auto;padding:16px}.card{background:var(--c);border:1px solid var(--l);border-radius:10px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.stat .n{font-size:28px;font-weight:700;color:var(--b)}.stat .k{color:var(--m);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--l)}th{color:var(--m);font-weight:600;font-size:12px;text-transform:uppercase}
.tw{overflow-x:auto}button.btn,.btn{background:var(--b);color:#fff;border:0;border-radius:6px;padding:9px 14px;font-size:14px;cursor:pointer;margin:2px}
.btn.s{background:#e8e8ea;color:var(--t)}.btn.d{background:#c0392b}.btn.g{background:#1e8e4e}.btn.sm{padding:5px 9px;font-size:12px}
input,select,textarea{width:100%;padding:9px;border:1px solid #c5cfda;border-radius:6px;font-size:15px;font-family:inherit}label{display:block;font-size:12px;color:var(--m);margin:8px 0 3px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#e7edf4}
.Scheduled,.Draft{background:#e7edf4}.In.Progress,.Sent{background:#fff1c9}.Completed,.Approved{background:#d4f3df}.Invoiced{background:#dde8ff}.Paid{background:#c7f0d8}.Declined{background:#f9d6d2}
.sample{font-size:10px;background:#ffe2a8;padding:1px 5px;border-radius:4px;margin-left:4px}h2{margin:0 0 10px;font-size:18px}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 8px;z-index:9}.modal>div{background:#fff;border-radius:10px;padding:18px;width:100%;max-width:760px}
.clk{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--l);flex-wrap:wrap}.on-clock{color:#1e8e4e;font-weight:600}
.qv{max-width:800px;margin:auto;background:#fff;padding:32px;border:1px solid var(--l)}.qv .tot td{font-weight:700}.right{text-align:right}
@media print{header,nav,.noprint{display:none!important}main{padding:0}.qv{border:0}body{background:#fff}}
.hlogo{height:30px;vertical-align:middle;margin-right:10px}.cpm{display:inline-block;background:var(--b);color:#fff;font-weight:900;font-style:italic;letter-spacing:-1px;padding:2px 7px;border-radius:5px;margin-right:8px;border:2px solid #fff;box-shadow:2px 2px 0 #000}.auth{position:fixed;inset:0;background:linear-gradient(160deg,#111 60%,#D7262E);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}.auth>div{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:380px}.auth a{color:var(--b);font-size:13px;cursor:pointer}.amsg{font-size:13px;margin-top:10px;color:#c0392b}.amsg.ok{color:#1e8e4e}#syncst{font-size:12px;opacity:.85}
</style></head><body>
<header><h1 id="cname"><img src="logo-mono-white.png" alt="" class="hlogo">Central Plumbing</h1><span style="font-size:12px;opacity:.8" id="today"></span><span id="syncst"></span><button class="btn s sm noprint" id="signout" style="display:none">Sign out</button></header>
<div class="auth" id="auth"><div><div style="text-align:center;margin-bottom:12px"><img src="logo.png" alt="Central Plumbing" style="width:190px;max-width:70%"></div><div id="authbody"><p style="color:var(--m)">Loading…</p></div></div></div>
<nav id="nav"></nav><main id="app"></main><div id="modal"></div>
<script>
const K='plumbingAppData_v1';const TABS=[['dash','Dashboard'],['clock','Time Clock'],['jobs','Jobs'],['quotes','Quotes'],['clients','Clients'],['workers','Workers'],['sheets','Timesheets'],['settings','Settings']];
const JS=['Scheduled','In Progress','Completed','Invoiced','Paid'],QS=['Draft','Sent','Approved','Declined'];
let D,tab='dash',view=null;const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(+n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dtl=d=>{d=new Date(d);return ymd(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const hrs=e=>((e.out?new Date(e.out):new Date())-new Date(e.in))/36e5;const fmtDT=d=>d?new Date(d).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
function weekStart(d){d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function blank(){return{settings:{company:'Central Plumbing',rate:95,fee:89,tax:7.5,phone:'308-390-8535',email:''},workers:[],clients:[],quotes:[],jobs:[],time:[],parts:[],templates:[],seq:{q:1001,j:1001}}}
function load(){try{D=JSON.parse(localStorage.getItem(K))}catch(e){}if(!D){D=blank();seed()}}
function save(){localStorage.setItem(K,JSON.stringify(D));if(window.cloudSave)window.cloudSave()}
window.getD=()=>D;window.setD=x=>{D=x;localStorage.setItem(K,JSON.stringify(D))};window.rerender=()=>{if(!$('#modal').innerHTML)render();else window._pendingRender=true};
const W=id=>D.workers.find(x=>x.id==id),C=id=>D.clients.find(x=>x.id==id),Q=id=>D.quotes.find(x=>x.id==id),J=id=>D.jobs.find(x=>x.id==id);
function seed(){const S=true,now=new Date(),day=n=>{const d=new Date(now);d.setDate(d.getDate()+n);return d};
 const w1={id:uid(),name:'Sample - Mike Torres',rate:32,sample:S},w2={id:uid(),name:'Sample - Dana Kealoha',rate:28,sample:S};D.workers.push(w1,w2);
 const c1={id:uid(),name:'Sample - Smith Residence',phone:'(308) 555-0142',address:'412 G St, Central City, NE',email:'',sample:S},c2={id:uid(),name:'Sample - Main St Diner',phone:'(308) 555-0199',address:'1601 17th St, Central City, NE',email:'',sample:S};D.clients.push(c1,c2);
 const q1={id:uid(),num:'Q-'+D.seq.q++,client:c1.id,date:ymd(now),status:'Approved',tax:D.settings.tax,notes:'Replace 50-gal gas water heater. Includes haul-away of old unit.',items:[{type:'fee',desc:'Service call / trip fee',qty:1,price:89},{type:'labor',desc:'Install labor',qty:4,price:95},{type:'part',desc:'50-gal gas water heater',qty:1,price:899},{type:'part',desc:'Flex connectors & fittings',qty:1,price:64.5}],sample:S};
 const q2={id:uid(),num:'Q-'+D.seq.q++,client:c2.id,date:ymd(now),status:'Sent',tax:D.settings.tax,notes:'Grease trap cleanout and kitchen drain jetting.',items:[{type:'fee',desc:'Service call / trip fee',qty:1,price:89},{type:'labor',desc:'Jetting labor',qty:3,price:95},{type:'part',desc:'Jetter rental',qty:1,price:150}],sample:S};D.quotes.push(q1,q2);
 const j1={id:uid(),num:'J-'+D.seq.j++,client:c1.id,desc:'Water heater replacement',workers:[w1.id,w2.id],when:dtl(new Date(now.setHours(9,0,0,0))),status:'In Progress',quote:q1.id,sample:S};
 const j2={id:uid(),num:'J-'+D.seq.j++,client:c2.id,desc:'Leaking faucet & slow drain',workers:[w2.id],when:dtl(new Date(day(2).setHours(13,30,0,0))),status:'Scheduled',quote:'',sample:S};D.jobs.push(j1,j2);
 const ws=weekStart(new Date());for(let i=0;i<3;i++){const d=new Date(ws);d.setDate(d.getDate()+i);if(d>new Date())break;const a=new Date(d);a.setHours(8,0);const b=new Date(d);b.setHours(16,30);D.time.push({id:uid(),worker:w1.id,job:j1.id,in:a.toISOString(),out:b.toISOString(),sample:S});const a2=new Date(d);a2.setHours(9,0);const b2=new Date(d);b2.setHours(15,0);D.time.push({id:uid(),worker:w2.id,job:i?j1.id:'',in:a2.toISOString(),out:b2.toISOString(),sample:S})}
 save()}
function clearSample(){if(!confirm('Remove all sample data?'))return;['workers','clients','quotes','jobs','time'].forEach(k=>D[k]=D[k].filter(x=>!x.sample));save();render()}
const tag=x=>x&&x.sample?'<span class="sample">SAMPLE</span>':'';
const qTotals=q=>{const sub=q.items.reduce((s,i)=>s+(+i.qty||0)*(+i.price||0),0),taxable=q.items.filter(i=>i.type=='part').reduce((s,i)=>s+i.qty*i.price,0);const tax=sub*(+q.tax||0)/100;return{sub,tax,total:sub+tax}};
const jobHours=id=>D.time.filter(t=>t.job==id).reduce((s,t)=>s+hrs(t),0);
const cname=id=>{const c=C(id);return c?esc(c.name):'<i>—</i>'};
function render(){if(!D.settings.company||D.settings.company=='Your Plumbing Co.')D.settings.company='Central Plumbing';if(!D.settings.phone)D.settings.phone='308-390-8535';$('#cname').innerHTML='<img src="logo-mono-white.png" alt="" class="hlogo">'+esc(D.settings.company);$('#today').textContent=new Date().toDateString();
 $('#nav').innerHTML=TABS.map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${v}</button>`).join('');$('#app').innerHTML=(V[tab]||V.dash)()}
function go(t){tab=t;view=null;render();scrollTo(0,0)}
function modal(h){$('#modal').innerHTML=h?`<div class="modal" onclick="if(event.target==this)modal()"><div>${h}</div></div>`:''}
const opt=(arr,sel,blankLbl)=>(blankLbl!=null?`<option value="">${blankLbl}</option>`:'')+arr.map(([v,l])=>`<option value="${esc(v)}" ${v==sel?'selected':''}>${esc(l)}</option>`).join('');
const V={};
V.dash=()=>{const t=ymd(new Date()),ws=weekStart(new Date());const open=D.jobs.filter(j=>['Scheduled','In Progress'].includes(j.status)),today=D.jobs.filter(j=>j.when&&j.when.slice(0,10)==t);
 const wh=D.time.filter(e=>new Date(e.in)>=ws).reduce((s,e)=>s+hrs(e),0),pend=D.quotes.filter(q=>['Draft','Sent'].includes(q.status));const pt=pend.reduce((s,q)=>s+qTotals(q).total,0);
 const on=D.time.filter(e=>!e.out);
 return `<div class="grid"><div class="card stat"><div class="n">${open.length}</div><div class="k">Open jobs</div></div><div class="card stat"><div class="n">${today.length}</div><div class="k">Jobs today</div></div><div class="card stat"><div class="n">${wh.toFixed(1)}</div><div class="k">Hours this week</div></div><div class="card stat"><div class="n">${money(pt)}</div><div class="k">Pending quotes (${pend.length})</div></div></div>
 <div class="card"><h2>Today's jobs</h2>${jobTable(today)}</div><div class="card"><h2>On the clock now</h2>${on.length?on.map(e=>`<div>${esc(W(e.worker)?.name)} — since ${fmtDT(e.in)} ${e.job?'· '+esc(J(e.job)?.num):''}</div>`).join(''):'<span style="color:var(--m)">Nobody clocked in.</span>'}</div>
 <div class="card noprint"><button class="btn" onclick="go('quotes');editQuote()">+ New quote</button><button class="btn" onclick="go('jobs');editJob()">+ New job</button><button class="btn s" onclick="go('clock')">Time clock</button></div>`};
function jobTable(list){if(!list.length)return '<span style="color:var(--m)">No jobs.</span>';return `<div class="tw"><table><tr><th>Job</th><th>Client</th><th>When</th><th>Workers</th><th>Status</th><th>Hours</th><th></th></tr>${list.sort((a,b)=>(a.when||'').localeCompare(b.when||'')).map(j=>`<tr><td>${esc(j.num)}${tag(j)}<br><small>${esc(j.desc)}</small></td><td>${cname(j.client)}</td><td>${fmtDT(j.when)}</td><td>${j.workers.map(w=>esc(W(w)?.name||'')).join(', ')}</td><td><span class="pill ${j.status}">${j.status}</span></td><td>${jobHours(j.id).toFixed(1)}</td><td><button class="btn sm s" onclick="editJob('${j.id}')">Open</button></td></tr>`).join('')}</table></div>`}
let jf={status:'',worker:'',range:'all',date:''};
V.jobs=()=>{let L=D.jobs.slice();const t=ymd(new Date()),ws=weekStart(new Date()),we=new Date(ws);we.setDate(we.getDate()+7);
 if(jf.status)L=L.filter(j=>j.status==jf.status);if(jf.worker)L=L.filter(j=>j.workers.includes(jf.worker));
 if(jf.range=='today')L=L.filter(j=>j.when&&j.when.slice(0,10)==t);if(jf.range=='week')L=L.filter(j=>j.when&&new Date(j.when)>=ws&&new Date(j.when)<we);if(jf.date)L=L.filter(j=>j.when&&j.when.slice(0,10)==jf.date);
 return `<div class="card"><div class="row" style="align-items:end"><div><label>Status</label><select onchange="jf.status=this.value;render()">${opt(JS.map(s=>[s,s]),jf.status,'All')}</select></div><div><label>Worker</label><select onchange="jf.worker=this.value;render()">${opt(D.workers.map(w=>[w.id,w.name]),jf.worker,'All')}</select></div><div><label>View</label><select onchange="jf.range=this.value;render()">${opt([['all','All dates'],['today','Today'],['week','This week']],jf.range)}</select></div><div><label>Date</label><input type="date" value="${jf.date}" onchange="jf.date=this.value;render()"></div><div style="flex:0"><button class="btn" onclick="editJob()">+ Job</button></div></div></div><div class="card">${jobTable(L)}</div>`};
function editJob(id,fromQuote){const j=id?J(id):Object.assign({id:'',num:'',client:'',desc:'',workers:[],when:'',status:'Scheduled',quote:''},fromQuote||{});
 const te=id?D.time.filter(t=>t.job==id):[];
 modal(`<h2>${id?'Job '+esc(j.num):'New job'}</h2>${clientPicker(j.client)}<label>Description</label><textarea id="jd" rows="2">${esc(j.desc)}</textarea>
 <div class="row"><div><label>Scheduled</label><input id="jw" type="datetime-local" value="${j.when||''}"></div><div><label>Status</label><select id="js">${opt(JS.map(s=>[s,s]),j.status)}</select></div><div><label>Linked quote</label><select id="jq">${opt(D.quotes.map(q=>[q.id,q.num+' · '+(C(q.client)?.name||'')]),j.quote,'None')}</select></div></div>
 <label>Assigned workers</label><div>${D.workers.map(w=>`<label style="display:inline-flex;gap:4px;margin-right:12px;color:var(--t);font-size:14px"><input type="checkbox" style="width:auto" class="jwk" value="${w.id}" ${j.workers.includes(w.id)?'checked':''}>${esc(w.name)}</label>`).join('')||'<i>Add workers first</i>'}</div>
 ${id?`<h3 style="font-size:15px">Hours logged: ${jobHours(id).toFixed(2)} · Labor cost ${money(te.reduce((s,t)=>s+hrs(t)*(W(t.worker)?.rate||0),0))}</h3><div class="tw"><table>${te.map(t=>`<tr><td>${esc(W(t.worker)?.name)}</td><td>${fmtDT(t.in)} – ${t.out?fmtDT(t.out):'<b class="on-clock">on clock</b>'}</td><td>${hrs(t).toFixed(2)}h</td></tr>`).join('')}</table></div>`:''}
 <div style="margin-top:14px"><button class="btn" onclick="saveJob('${id||''}')">Save</button>${j.quote?`<button class="btn s" onclick="modal();viewQuote('${j.quote}')">View quote</button>`:''}${id?`<button class="btn d" onclick="if(confirm('Delete job?')){D.jobs=D.jobs.filter(x=>x.id!='${id}');save();modal();render()}">Delete</button>`:''}<button class="btn s" onclick="modal()">Cancel</button></div>`)}
function clientPicker(sel){return `<div class="row"><div><label>Client</label><select id="cl" onchange="document.getElementById('nc').style.display=this.value=='__new'?'flex':'none'">${opt(D.clients.map(c=>[c.id,c.name]),sel,'— choose —')}<option value="__new">+ New client…</option></select></div></div><div id="nc" class="row" style="display:none"><div><label>Name</label><input id="ncn"></div><div><label>Phone</label><input id="ncp" type="tel"></div><div><label>Address</label><input id="nca"></div></div>`}
function pickClient(){let v=$('#cl').value;if(v=='__new'){const n=$('#ncn').value.trim();if(!n){alert('Client name required');return null}const c={id:uid(),name:n,phone:$('#ncp').value,address:$('#nca').value,email:''};D.clients.push(c);v=c.id}if(!v){alert('Choose a client');return null}return v}
function saveJob(id){const cl=pickClient();if(!cl)return;let j=id?J(id):{id:uid(),num:'J-'+D.seq.j++};Object.assign(j,{client:cl,desc:$('#jd').value,when:$('#jw').value,status:$('#js').value,quote:$('#jq').value,workers:[...document.querySelectorAll('.jwk:checked')].map(x=>x.value)});if(!id)D.jobs.push(j);save();modal();render()}
V.quotes=()=>{if(view)return quoteDoc(Q(view));return `<div class="card"><button class="btn" onclick="editQuote()">+ New quote</button></div><div class="card"><div class="tw"><table><tr><th>Quote</th><th>Client</th><th>Date</th><th>Status</th><th class="right">Total</th><th></th></tr>${D.quotes.slice().reverse().map(q=>`<tr><td>${esc(q.num)}${tag(q)}</td><td>${cname(q.client)}</td><td>${q.date}</td><td><span class="pill ${q.status}">${q.status}</span></td><td class="right">${money(qTotals(q).total)}</td><td><button class="btn sm s" onclick="viewQuote('${q.id}')">View</button><button class="btn sm s" onclick="editQuote('${q.id}')">Edit</button></td></tr>`).join('')||'<tr><td colspan=6>No quotes yet.</td></tr>'}</table></div></div>`};
function viewQuote(id){tab='quotes';view=id;render();scrollTo(0,0)}
function quoteDoc(q){const t=qTotals(q),c=C(q.client)||{},s=D.settings,job=D.jobs.find(j=>j.quote==q.id);
 return `<div class="noprint card"><button class="btn s" onclick="view=null;render()">← Back</button><button class="btn" onclick="print()">Print / Save PDF</button><button class="btn s" onclick="editQuote('${q.id}')">Edit</button>${QS.map(st=>`<button class="btn sm ${st==q.status?'':'s'}" onclick="setQS('${q.id}','${st}')">${st}</button>`).join('')}${q.status=='Approved'?(job?`<button class="btn s" onclick="go('jobs');editJob('${job.id}')">Open job ${esc(job.num)}</button>`:`<button class="btn g" onclick="toJob('${q.id}')">Convert to job</button>`):''}</div>
 <div class="qv"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px"><div><img src="logo.png" alt="" style="height:90px;display:block;margin-bottom:6px"><div style="font-size:22px;font-weight:700;color:var(--bd)">${esc(s.company)}</div><div style="color:var(--m);font-size:13px">${esc(s.phone)} ${esc(s.email)}</div></div><div class="right"><div style="font-size:20px;font-weight:700">QUOTE</div><div>${esc(q.num)}</div><div style="color:var(--m)">${q.date}</div><span class="pill ${q.status} noprint">${q.status}</span></div></div>
 <div style="margin:22px 0"><div style="color:var(--m);font-size:12px">PREPARED FOR</div><b>${esc(c.name)}</b><br>${esc(c.address)}<br>${esc(c.phone)}</div>
 <table><tr><th>Description</th><th class="right">Qty/Hrs</th><th class="right">Rate</th><th class="right">Amount</th></tr>${q.items.map(i=>`<tr><td>${esc(i.desc)} <small style="color:var(--m)">(${{labor:'Labor',part:'Parts',fee:'Service fee'}[i.type]})</small></td><td class="right">${i.qty}</td><td class="right">${money(i.price)}</td><td class="right">${money(i.qty*i.price)}</td></tr>`).join('')}
 <tr><td colspan=3 class="right">Subtotal</td><td class="right">${money(t.sub)}</td></tr><tr><td colspan=3 class="right">Tax (${q.tax}%)</td><td class="right">${money(t.tax)}</td></tr><tr class="tot"><td colspan=3 class="right">Total</td><td class="right">${money(t.total)}</td></tr></table>
 ${q.notes?`<div style="margin-top:18px"><div style="color:var(--m);font-size:12px">NOTES</div>${esc(q.notes).replace(/\n/g,'<br>')}</div>`:''}<div style="margin-top:40px;color:var(--m);font-size:12px">Approved by: ______________________ Date: __________</div></div>`}
function setQS(id,s){Q(id).status=s;save();render()}
function toJob(id){const q=Q(id);go('jobs');editJob(null,{client:q.client,desc:q.notes||'From quote '+q.num,quote:q.id})}
let qi=[];
function editQuote(id){const q=id?Q(id):{client:'',date:ymd(new Date()),status:'Draft',tax:D.settings.tax,notes:'',items:[{type:'fee',desc:'Service call / trip fee',qty:1,price:D.settings.fee},{type:'labor',desc:'Labor',qty:1,price:D.settings.rate}]};qi=JSON.parse(JSON.stringify(q.items));
 modal(`<h2>${id?'Edit '+esc(q.num):'New quote'}</h2>${clientPicker(q.client)}<div class="row"><div><label>Date</label><input id="qd" type="date" value="${q.date}"></div><div><label>Status</label><select id="qs">${opt(QS.map(s=>[s,s]),q.status)}</select></div><div><label>Tax %</label><input id="qt" type="number" step="0.01" value="${q.tax}"></div></div>

 <div style="margin-top:14px"><button class="btn" onclick="saveTime('${id||''}')">Save</button>${id?`<button class="btn d" onclick="D.time=D.time.filter(x=>x.id!='${id}');save();modal();render()">Delete</button>`:''}<button class="btn s" onclick="modal()">Cancel</button></div>`)}

 return `<div class="card"><h2>${esc(w.name)}${tag(w)} <small style="color:var(--m);font-weight:400">· ${money(w.rate)}/hr · week of ${ws.toLocaleDateString()}</small></h2><div class="tw"><table><tr>${days.map(d=>`<th>${d.toLocaleDateString([], {weekday:'short',month:'numeric',day:'numeric'})}</th>`).join('')}<th>Total</th></tr><tr>${days.map(d=>`<td>${L.filter(t=>ymd(t.in)==ymd(d)).reduce((s,t)=>s+hrs(t),0).toFixed(2)}</td>`).join('')}<td><b>${tot.toFixed(2)}</b></td></tr></table></div>

{const _setD=window.setD;window.setD=x=>_setD(norm(x))}

 const parts=(j.actual||[]).length?act:estParts;return{price,lab,parts,cost:lab+parts,partsEst:!(j.actual||[]).length&&estParts>0}}

 modal(`<h2>${id?'Edit template':'New template'}</h2><label>Name</label><input id="tn" value="${esc(t.name)}" placeholder="Water heater install - 50 gal gas"><div class="row"><div><label>Labor hours</label><input id="th" type="number" step="0.25" value="${t.laborHours}"></div><div><label>Trip / service fee ($)</label><input id="tf" type="number" step="0.01" value="${t.fee}"></div></div><label>Notes (added to quote)</label><textarea id="tno" rows="2">${esc(t.notes)}</textarea>
 <label>Parts</label><div id="tparts"></div><div class="row"><select id="tadd">${opt(D.parts.map(p=>[p.id,p.name+' · '+money(sell(p))]),'','— add part from catalog —')}</select><button class="btn sm s" style="flex:0" onclick="if($('#tadd').value){tp.push({partId:$('#tadd').value,qty:1});drawTp()}">Add</button></div><small style="color:var(--m)">Add new parts in the Parts tab first.</small>

/* ---- Quotes: template picker, part catalog, costs ---- */
{const _eq=editQuote;editQuote=function(id){_eq(id);const box=$('#qitems');if(!box)return;box.insertAdjacentHTML('beforebegin',`<div class="row noprint" style="margin-bottom:8px;background:#f6eaeb;padding:8px;border-radius:8px"><select id="qtpl">${opt(D.templates.map(t=>[t.id,t.name+' · '+money(tmplPrice(t))]),'','— Start from template —')}</select><button class="btn sm" style="flex:0" onclick="applyTmpl()">Add template</button></div>`);
 box.nextElementSibling.insertAdjacentHTML('beforeend',` <select id="qpart" style="width:auto;max-width:220px" onchange="if(this.value){const p=P(this.value);qi.push({type:'part',desc:p.name,qty:1,price:+sell(p).toFixed(2),cost:+p.cost||0,partId:p.id});this.value='';drawLi()}">${opt(D.parts.map(p=>[p.id,p.name]),'','+ Part from catalog…')}</select>`);
 if(isOwner())$('#qtot').insertAdjacentHTML('afterend','<div id="qprof" style="text-align:right;font-size:13px;color:#1e8e4e;margin-bottom:8px"></div>');qtot()}}
function applyTmpl(){const t=T($('#qtpl').value);if(!t)return;
 if(qi.length==2&&qi[0].type=='fee'&&qi[1].type=='labor'&&qi[1].qty==1&&qi[1].desc=='Labor'&&!qi.some(i=>i.type=='part'))qi=[]; // drop default lines on first template
 if(+t.fee&&!qi.some(i=>i.type=='fee'))qi.push({type:'fee',desc:'Service call / trip fee',qty:1,price:+t.fee});
 if(+t.laborHours)qi.push({type:'labor',desc:'Labor - '+t.name.replace(/^Sample - /,''),qty:+t.laborHours,price:+D.settings.rate||0});
 t.parts.forEach(x=>{const p=P(x.partId);if(p)qi.push({type:'part',desc:p.name,qty:+x.qty||1,price:+sell(p).toFixed(2),cost:+p.cost||0,partId:p.id})});
 if(t.notes){const n=$('#qn');n.value=(n.value?n.value+'\n':'')+t.notes}$('#qtpl').value='';drawLi()}
{const _qt=qtot;qtot=function(){_qt();const el=$('#qprof');if(el&&isOwner()){const q={items:qi,tax:0},pr=qTotals(q).sub,c=quoteCost(q);el.textContent=`Est. cost ${money(c)} · Profit ${money(pr-c)} · Margin ${pct(pr,c)}`}}}
{const _dl=drawLi;drawLi=function(){_dl();if(!isOwner())return;[...$('#qitems').children].forEach((row,n)=>{const i=qi[n];if(i&&i.type=='part'){if(i.cost==null&&P(i.partId))i.cost=+P(i.partId).cost||0;row.querySelector('button').insertAdjacentHTML('beforebegin',`<input style="flex:0 0 85px;min-width:0" type="number" step="0.01" title="My cost (each)" placeholder="my cost" value="${i.cost??''}" oninput="qi[${n}].cost=this.value===''?null:+this.value;qtot()">`)}})}}
{const _qd=quoteDoc;quoteDoc=function(q){let h=_qd(q);if(isOwner()){const pr=qTotals(q).sub,c=quoteCost(q);h=h.replace('<div class="qv">',profitBox(pr,c,'Quote ')+'<div class="qv">')}return h}}

/* ---- Jobs: actual part costs + profit ---- */
let ja=[];
{const _ej=editJob;editJob=function(id,fq){_ej(id,fq);if(!isOwner()||!$('#modal').innerHTML)return;const j=id?J(id):{};ja=JSON.parse(JSON.stringify(j.actual||[]));
 const btns=$('#modal .modal>div>div:last-child');btns.insertAdjacentHTML('beforebegin',`<div class="noprint" style="margin-top:14px;border-top:1px solid var(--l);padding-top:10px"><h3 style="font-size:15px;margin:0">Actual part costs paid <small style="color:var(--m);font-weight:400">(owner only · updates the part's "last cost")</small></h3><div id="jact"></div><div class="row"><select id="jaadd">${opt(D.parts.map(p=>[p.id,p.name]),'','— part from catalog —')}<option value="__other">Other (not in catalog)</option></select><button class="btn sm s" style="flex:0" onclick="addJa()">Add</button></div><div id="jprof"></div></div>`);drawJa(j)}}
function addJa(){const v=$('#jaadd').value;if(!v)return;const p=P(v);ja.push({partId:p?p.id:'',desc:p?p.name:'',qty:1,cost:p?(p.lastCost??p.cost??0):0,date:ymd(new Date())});drawJa()}
function drawJa(){$('#jact').innerHTML=ja.map((a,n)=>`<div class="row" style="align-items:center;margin-bottom:4px">${a.partId?`<div style="flex:3">${esc(P(a.partId)?.name||a.desc)}</div>`:`<input style="flex:3" placeholder="Description" value="${esc(a.desc)}" oninput="ja[${n}].desc=this.value">`}<input style="flex:0 0 70px;min-width:0" type="number" step="0.25" title="Qty" value="${a.qty}" oninput="ja[${n}].qty=+this.value;jprof()"><input style="flex:0 0 90px;min-width:0" type="number" step="0.01" title="Cost paid each" value="${a.cost}" oninput="ja[${n}].cost=+this.value;jprof()"><input style="flex:0 0 140px;min-width:0" type="date" value="${a.date}" oninput="ja[${n}].date=this.value"><button class="btn sm d" style="flex:0" onclick="ja.splice(${n},1);drawJa()">✕</button></div>`).join('')||'<small style="color:var(--m)">None recorded — profit uses the quote\'s estimated part costs.</small>';jprof()}
function jprof(){const el=$('#jprof');if(!el)return;const j={id:window._jid||'',quote:$('#jq')?.value,actual:ja};const f=jobFin(j);el.innerHTML=f.price||f.cost?profitBox(f.price,f.cost,'Job '):'<small style="color:var(--m)">Link a quote to see job profit.</small>'}
{const _ej2=editJob;editJob=function(id,fq){window._jid=id||'';_ej2(id,fq)}}
{const _sj=saveJob;saveJob=function(id){const before=D.jobs.length;const keep=ja.slice(),own=isOwner()&&!!$('#jact');
 const _save=save;let jobRef=null;save=function(){if(own){jobRef=id?J(id):D.jobs[D.jobs.length-1];if(jobRef){jobRef.actual=keep.filter(a=>a.partId||a.desc);jobRef.actual.forEach(a=>{const p=P(a.partId);if(p&&(!p.lastDate||a.date>=p.lastDate)){p.lastCost=+a.cost;p.lastDate=a.date}})}}_save()};
 try{_sj(id)}finally{save=_save}}}

/* ---- Dashboard profit report ---- */
{const _vd=V.dash;V.dash=()=>{let h=_vd();if(!isOwner())return h;const L=D.jobs.filter(j=>j.quote||(j.actual||[]).length||jobHours(j.id)).map(j=>({j,f:jobFin(j)}));
 const by={};L.forEach(({j,f})=>{const m=(j.when||'').slice(0,7)||'No date';by[m]=by[m]||{p:0,c:0,n:0};by[m].p+=f.price;by[m].c+=f.cost;by[m].n++});
 const tp=L.reduce((s,x)=>s+x.f.price,0),tc=L.reduce((s,x)=>s+x.f.cost,0);
 return h+`<div class="card noprint"><h2>Profit report <small style="color:var(--m);font-weight:400;font-size:12px">owner only · price = linked quote subtotal (pre-tax) · cost = parts (actual, else quoted cost) + logged labor at worker cost</small></h2>
 <div class="grid"><div class="stat"><div class="n">${money(tp)}</div><div class="k">Revenue (all jobs)</div></div><div class="stat"><div class="n">${money(tc)}</div><div class="k">Cost</div></div><div class="stat"><div class="n" style="color:${tp-tc<0?'#c0392b':'#1e8e4e'}">${money(tp-tc)}</div><div class="k">Profit · ${pct(tp,tc)}</div></div></div>
 <h3 style="font-size:15px">By month</h3><div class="tw"><table><tr><th>Month</th><th>Jobs</th><th class="right">Price</th><th class="right">Cost</th><th class="right">Profit</th><th class="right">Margin</th></tr>${Object.keys(by).sort().reverse().map(m=>`<tr><td>${m}</td><td>${by[m].n}</td><td class="right">${money(by[m].p)}</td><td class="right">${money(by[m].c)}</td><td class="right">${money(by[m].p-by[m].c)}</td><td class="right">${pct(by[m].p,by[m].c)}</td></tr>`).join('')||'<tr><td colspan=6>No data yet.</td></tr>'}</table></div>
 <h3 style="font-size:15px">By job</h3><div class="tw"><table><tr><th>Job</th><th>Client</th><th class="right">Price</th><th class="right">Parts</th><th class="right">Labor</th><th class="right">Profit</th><th class="right">Margin</th></tr>${L.sort((a,b)=>(b.j.when||'').localeCompare(a.j.when||'')).map(({j,f})=>`<tr><td><a href="#" onclick="editJob('${j.id}');return false">${esc(j.num)}</a>${tag(j)}</td><td>${cname(j.client)}</td><td class="right">${money(f.price)}</td><td class="right">${money(f.parts)}${f.partsEst?'<small> est</small>':''}</td><td class="right">${money(f.lab)}</td><td class="right">${money(f.price-f.cost)}</td><td class="right">${pct(f.price,f.cost)}</td></tr>`).join('')||'<tr><td colspan=7>No jobs yet.</td></tr>'}</table></div></div>`}}

/* ---- Workers: optional hourly cost ---- */
{const _vw=V.workers;V.workers=()=>{let h=_vw();if(!isOwner())return h;h=h.replace('<th>Rate</th>','<th>Rate</th><th>My cost/hr <small>(optional, for profit)</small></th>');
 D.workers.forEach(w=>{h=h.replace(`onchange="W('${w.id}').rate=+this.value;save()"></td>`,`onchange="W('${w.id}').rate=+this.value;save()"></td><td><input type="number" step="0.01" style="max-width:110px" placeholder="= rate" value="${w.cost||''}" onchange="W('${w.id}').cost=+this.value;save()"></td>`)});return h}}

/* ---- Settings: labor cost rate ---- */
{const _vs=V.settings;V.settings=()=>{let h=_vs();if(isOwner())h=h.replace('</div></div>\n <div class="card"><h2>Backup','</div><div class="row"><div><label>Labor cost $/hr for quote estimates (owner only; blank = avg worker cost '+money(laborCostRate())+')</label><input type="number" step="0.01" value="'+(D.settings.laborCost||'')+'" onchange="D.settings.laborCost=+this.value;save()"></div></div></div>\n <div class="card"><h2>Backup');return h}}
{const _ij=importJSON;importJSON=function(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.settings||!x.jobs)throw 0;if(confirm('Replace current data with backup?')){D=norm(x);save();render()}}catch(e){alert('Not a valid backup file')}};r.readAsText(f)}}
window.onUserChange=()=>render();
render();

<script type="module">
/* ================================================================
   FIREBASE CONFIG — paste your config from Firebase Console here
   (Project settings > General > Your apps > Web app > SDK setup)
   ================================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyAka3SYqrDLxlxRIul4z1rzLW2M3BNrqyg",
  authDomain: "plumbing-ops.firebaseapp.com",
  projectId: "plumbing-ops",
  storageBucket: "plumbing-ops.firebasestorage.app",
  messagingSenderId: "666842819764",
  appId: "1:666842819764:web:9ddcad8fb444159854bbe1"
};
/* ================================================================ */
const COMPANY='main';
const COLS={clients:'clients',workers:'workers',jobs:'jobs',quotes:'quotes',time:'timeEntries',parts:'parts',templates:'templates'}; // D key -> Firestore collection
const $=s=>document.querySelector(s), body=$('#authbody'), st=$('#syncst');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(firebaseConfig.apiKey.startsWith('PASTE')){
  body.innerHTML=`<p><b>Live sync is not configured yet.</b></p><p style="color:var(--m);font-size:14px">Paste your Firebase config into <code>index.html</code> (see SETUP.md). Until then you can keep using the app on this device only.</p><button class="btn" id="offline">Use offline on this device</button>`;
  $('#offline').onclick=()=>{$('#auth').style.display='none'};
} else start().catch(e=>{body.innerHTML=`<p class="amsg">Could not load sync: ${esc(e.message)}</p><button class="btn" onclick="location.reload()">Retry</button>`});

async function start(){
  const V='10.12.2', base=`https://www.gstatic.com/firebasejs/${V}/`;
  const {initializeApp}=await import(base+'firebase-app.js');
  const A=await import(base+'firebase-auth.js');
  const F=await import(base+'firebase-firestore.js');
  const app=initializeApp(firebaseConfig), auth=A.getAuth(app);
  let db; try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){db=F.getFirestore(app)}
  const co=F.doc(db,'companies',COMPANY), metaRef=F.doc(co,'settings','main');
  let unsubs=[], last={}, applying=false, ready=false;

  function showLogin(msg='',ok=false){
    $('#auth').style.display='flex';$('#signout').style.display='none';st.textContent='';
    body.innerHTML=`<label>Email</label><input id="ae" type="email" autocomplete="username"><label>Password</label><input id="ap" type="password" autocomplete="current-password"><div style="margin-top:14px"><button class="btn" id="ain">Sign in</button></div><div style="margin-top:10px"><a id="areset">Forgot password? Send reset email</a></div><div class="amsg ${ok?'ok':''}" id="amsg">${esc(msg)}</div>`;
    const go=async()=>{try{$('#amsg').textContent='Signing in…';await A.signInWithEmailAndPassword(auth,$('#ae').value.trim(),$('#ap').value)}catch(e){$('#amsg').className='amsg';$('#amsg').textContent=nice(e)}};
    $('#ain').onclick=go;$('#ap').onkeydown=e=>{if(e.key=='Enter')go()};
    $('#areset').onclick=async()=>{const e=$('#ae').value.trim();if(!e){$('#amsg').textContent='Type your email above first.';return}
      try{await A.sendPasswordResetEmail(auth,e);$('#amsg').className='amsg ok';$('#amsg').textContent='Reset email sent — check your inbox.'}catch(x){$('#amsg').textContent=nice(x)}};
  }
  const nice=e=>({'auth/invalid-credential':'Wrong email or password.','auth/wrong-password':'Wrong email or password.','auth/user-not-found':'No account with that email.','auth/invalid-email':'That email looks wrong.','auth/too-many-requests':'Too many tries — wait a bit and try again.','permission-denied':'This account is not allowed to access company data.'}[e.code]||e.message);
  $('#signout').onclick=()=>A.signOut(auth);

  const meta=D=>({settings:D.settings,seq:D.seq});
  const snapLast=D=>{last={};for(const k in COLS){last[k]={};(D[k]||[]).forEach(x=>last[k][x.id]=JSON.stringify(x))}last.meta=JSON.stringify(meta(D))};
  const clean=o=>JSON.parse(JSON.stringify(o)); // strips undefined (Firestore rejects it)

  // Push only what changed since last sync
  async function push(full=false){
    if(applying||!ready&&!full)return;const D=getD();const b=[];
    for(const k in COLS){const prev=full?{}:(last[k]||{}),cur={};(D[k]||[]).forEach(x=>{if(!x.id)return;const j=JSON.stringify(x);cur[x.id]=j;if(prev[x.id]!==j)b.push(['set',F.doc(co,COLS[k],x.id),clean(x)])});
      for(const id in prev)if(!(id in cur))b.push(['del',F.doc(co,COLS[k],id)])}
    const m=JSON.stringify(meta(D));if(full||m!==last.meta)b.push(['set',metaRef,clean(meta(D))]);
    snapLast(D);
    for(let i=0;i<b.length;i+=400){const wb=F.writeBatch(db);b.slice(i,i+400).forEach(([t,r,v])=>t=='set'?wb.set(r,v):wb.delete(r));
      try{await wb.commit()}catch(e){st.textContent='⚠ sync error';alert('Sync error: '+nice(e))}}
  }
  window.cloudSave=()=>push();

  function listen(){
    unsubs.forEach(u=>u());unsubs=[];
    for(const k in COLS)unsubs.push(F.onSnapshot(F.collection(co,COLS[k]),{includeMetadataChanges:true},s=>{
      const D=getD();D[k]=s.docs.map(d=>d.data());last[k]={};D[k].forEach(x=>last[k][x.id]=JSON.stringify(x));apply(D,s)},err));
    unsubs.push(F.onSnapshot(metaRef,{includeMetadataChanges:true},s=>{if(!s.exists())return;const D=getD(),m=s.data();if(m.settings)D.settings=m.settings;if(m.seq)D.seq=m.seq;last.meta=JSON.stringify(meta(D));apply(D,s)},err));
  }
  function apply(D,s){applying=true;setD(D);applying=false;st.textContent=s.metadata.fromCache?'● offline (cached)':(s.metadata.hasPendingWrites?'● syncing…':'● live');rerender();$('#cname').innerHTML='<img src="logo-mono-white.png" alt="" class="hlogo">'+esc(!D.settings.company||D.settings.company=='Your Plumbing Co.'?'Central Plumbing':D.settings.company)}
  function err(e){st.textContent='⚠ '+nice(e);if(e.code=='permission-denied'){alert(nice(e));A.signOut(auth)}}

  A.onAuthStateChanged(auth,async u=>{
    window.userEmail=u?u.email:null;window.onUserChange&&window.onUserChange();
    unsubs.forEach(x=>x());unsubs=[];ready=false;
    if(!u){showLogin();return}
    body.innerHTML='<p style="color:var(--m)">Loading company data…</p>';
    try{
      const ms=await F.getDoc(metaRef);let empty=!ms.exists();
      if(empty){for(const k in COLS){const q=await F.getDocs(F.query(F.collection(co,COLS[k]),F.limit(1)));if(!q.empty){empty=false;break}}}
      if(empty){const D=getD(),n=Object.keys(COLS).reduce((a,k)=>a+(D[k]||[]).filter(x=>!x.sample).length,0);
        if(n&&!confirm(`The shared company account is empty.\n\nUpload the ${n} record(s) saved on this device so everyone can see them?\n\nOK = upload  ·  Cancel = start fresh`)){const b=norm(blank());b.settings=D.settings;setD(b)}
        await push(true);
      }
      ready=true;listen();
      $('#auth').style.display='none';$('#signout').style.display='';$('#signout').title=u.email;
    }catch(e){if(e.code=='permission-denied'){showLogin('This account ('+u.email+') is not on the allowed list.');A.signOut(auth)}else showLogin('Error: '+nice(e))}
  });
}
</script></body></html>
