<script>
function phDigits(v){let d=String(v??'').replace(/\D/g,'');if(d.length==11&&d[0]=='1')d=d.slice(1);return d}
function fmtPhone(v){const s=String(v??'').trim();if(!s)return '';if(/[a-z#;,]/i.test(s))return s;const d=phDigits(s);return d.length==10?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:s}
const WPAL=['#C62828','#1565C0','#2E7D32','#6A1B9A','#D84315','#00796B','#AD1457','#4E342E','#37474F','#9E7700','#283593','#558B2F'];
const wEsc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function wInit(n){const w=String(n||'?').replace(/^Sample - /,'').trim().split(/\s+/);return ((w[0]||'?')[0]+(w.length>1?w[w.length-1][0]:'')).toUpperCase()}
function wCol(id){const w=(D.workers||[]).find(x=>x.id==id);if(w&&w.color)return w.color;let h=0;for(const ch of String(id||''))h=(h*31+ch.charCodeAt(0))>>>0;return WPAL[h%WPAL.length]}
function wChip(id,sm){const w=(D.workers||[]).find(x=>x.id==id);if(!w)return '';const c=wCol(id),n=String(w.name).replace(/^Sample - /,'');return `<span class="wchip${sm?' sm':''}" style="--wc:${c}" title="${wEsc(n)}"><b>${wInit(w.name)}</b>${sm?'':wEsc(n)}</span>`}
function wChips(ids,sm){return (ids||[]).map(i=>wChip(i,sm)).join('')||'<span style="color:var(--m)">—</span>'}
/* day clock vs job clock: kind 'day' = shift (payroll), kind 'job' = time on a job (billable); legacy entries (no kind) count as both */
const isDayT=t=>t.kind!='job',isJobT=t=>t.kind=='job'||(!t.kind&&!!t.job);
function dayOpen(w){return D.time.find(t=>t.worker==w&&!t.out&&isDayT(t))}
function jobOpen(w){return D.time.find(t=>t.worker==w&&!t.out&&(t.kind=='job'||(!t.kind&&t.job)))}
function tKind(t){return t.kind=='job'?'<span class="tk tkj" title="Job clock (billable)">JOB</span>':t.kind=='day'?'<span class="tk tkd" title="Day clock (payroll)">DAY</span>':'<span class="tk" title="Older entry: counts as day and job time">DAY+JOB</span>'}
function canClock(w){return isOwner()||w==myWorkerId()}
function hms(h){const s=Math.max(0,Math.floor(h*3600));return Math.floor(s/3600)+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function jcBar(j){if(!j||!j.id||typeof myWorkerId!='function')return '';const me=myWorkerId(),own=isOwner();const ws=(j.workers||[]).filter(w=>own||w==me);if(!ws.length||['Paid','Invoiced'].includes(j.status)&&!ws.some(w=>jobOpen(w)?.job==j.id))return '';
 return `<div class="jcb" onclick="event.stopPropagation()" ondragstart="event.stopPropagation()">${ws.map(w=>{const r=jobOpen(w),on=r&&r.job==j.id;return `<div class="jcr">${own?wChip(w,1):''}<b class="jcn">${wEsc(j.num)}</b>${on?`<span class="jtimer" data-since="${r.in}">${hms(hrsX(r))}</span><button class="btn sm d" data-tip="Stop the job clock on ${wEsc(j.num)}. The day clock keeps running." onclick="event.stopPropagation();jobStop('${w}')">■ Stop job</button>`:`<button class="btn sm g" data-tip="Start the job clock on ${wEsc(j.num)}. This is the time you can bill the customer." onclick="event.stopPropagation();jobStart('${w}','${j.id}')">▶ Start job</button>`}</div>`}).join('')}</div>`}
function telD(v){const p=phDigits(v);return p.length==10?p:String(v??'').replace(/[^\d+]/g,'')}

 const w1={id:uid(),name:'Sample - Mike Torres',rate:32,sample:S},w2={id:uid(),name:'Sample - Dana Kealoha',rate:28,sample:S};D.workers.push(w1,w2);
 const c1={id:uid(),name:'Sample - Smith Residence',phone:'(308) 555-0142',address:'412 G St, Central City, NE',email:'',sample:S},c2={id:uid(),name:'Sample - Main St Diner',phone:'(308) 555-0199',address:'1601 17th St, Central City, NE',email:'',sample:S};D.clients.push(c1,c2);
 const q1={id:uid(),num:'Q-'+D.seq.q++,client:c1.id,date:ymd(now),status:'Approved',tax:D.settings.tax,notes:'Replace 50-gal gas water heater. Includes haul-away of old unit.',items:[{type:'fee',desc:'Service call / trip fee',qty:1,price:89},{type:'labor',desc:'Install labor',qty:4,price:95},{type:'part',desc:'50-gal gas water heater',qty:1,price:899},{type:'part',desc:'Flex connectors & fittings',qty:1,price:64.5}],sample:S};
 const q2={id:uid(),num:'Q-'+D.seq.q++,client:c2.id,date:ymd(now),status:'Sent',tax:D.settings.tax,notes:'Grease trap cleanout and kitchen drain jetting.',items:[{type:'fee',desc:'Service call / trip fee',qty:1,price:89},{type:'labor',desc:'Jetting labor',qty:3,price:95},{type:'part',desc:'Jetter rental',qty:1,price:150}],sample:S};D.quotes.push(q1,q2);
 const j1={id:uid(),num:'J-'+D.seq.j++,client:c1.id,desc:'Water heater replacement',workers:[w1.id,w2.id],when:dtl(new Date(now.setHours(9,0,0,0))),status:'In Progress',quote:q1.id,sample:S};
 const j2={id:uid(),num:'J-'+D.seq.j++,client:c2.id,desc:'Leaking faucet & slow drain',workers:[w2.id],when:dtl(new Date(day(2).setHours(13,30,0,0))),status:'Scheduled',quote:'',sample:S};D.jobs.push(j1,j2);
 const ws=weekStart(new Date());for(let i=0;i<3;i++){const d=new Date(ws);d.setDate(d.getDate()+i);if(d>new Date())break;const a=new Date(d);a.setHours(8,0);const b=new Date(d);b.setHours(16,30);D.time.push({id:uid(),worker:w1.id,job:j1.id,in:a.toISOString(),out:b.toISOString(),sample:S});const a2=new Date(d);a2.setHours(9,0);const b2=new Date(d);b2.setHours(15,0);D.time.push({id:uid(),worker:w2.id,job:i?j1.id:'',in:a2.toISOString(),out:b2.toISOString(),sample:S})}
 save()}

function jobTable(list){if(!list.length)return '<span style="color:var(--m)">No jobs.</span>';return `<div class="tw"><table><tr><th>Job</th><th>Client</th><th>When</th><th>Workers</th><th>Status</th><th>Hours</th><th></th></tr>${list.sort((a,b)=>(a.when||'').localeCompare(b.when||'')).map(j=>`<tr><td>${esc(j.num)}${tag(j)}<br><small>${esc(j.desc)}</small>${jcBar(j)}</td><td>${cname(j.client)}</td><td>${fmtDT(j.when)}</td><td>${wChips(j.workers)}</td><td><span class="pill ${j.status}">${j.status}</span></td><td>${jobHours(j.id).toFixed(1)}</td><td><button class="btn sm s" onclick="editJob('${j.id}')">Open</button></td></tr>`).join('')}</table></div>`}

const idb={p:null,open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open('cp-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
 async run(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('p',mode),rq=fn(t.objectStore('p'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)})}};
window.localPhotoStore={async list(jid){return ((await idb.run('readonly',s=>s.getAll()))||[]).filter(p=>p.jobId==jid).map(p=>({...p,data:undefined,_d:p.data}))},async get(p){return p._d},
 async add(j,tag,data){const p={id:uid(),jobId:j.id,tag,by:ME(),byName:phName(),at:new Date().toISOString(),data};await idb.run('readwrite',s=>s.put(p));return p},async del(p){await idb.run('readwrite',s=>s.delete(p.id))}};

function compress(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const M=1280,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);let q=0.75,d=c.toDataURL('image/jpeg',q);while(d.length>2.5e6&&q>0.3){q-=0.15;d=c.toDataURL('image/jpeg',q)}res(d)};im.onerror=()=>rej(new Error('Not an image'));im.src=u})}

function occDates(s,to){const out=[],st=new Date(s.start+'T00:00');for(let k=0;k<2000;k++){let d;if(s.unit=='week'){d=new Date(st);d.setDate(d.getDate()+7*s.every*k)}else{const mm=s.unit=='month'?s.every*k:12*s.every*k;const y=st.getFullYear(),m=st.getMonth()+mm,dim=new Date(y,m+1,0).getDate();d=new Date(y,m,Math.min(st.getDate(),dim))}const v=ymd(d);if(v>to||(s.until&&v>s.until))break;if(v>s.lastGen)out.push(v)}return out}
function genRecurring(){if(!isOwner())return 0;const to=addDays(tod(),60);let n=0;D.recurring.filter(s=>s.active).forEach(s=>{occDates(s,to).forEach(d=>{const id='r_'+s.id+'_'+d.replace(/-/g,'');if(!J(id)){D.jobs.push({id,num:'J-'+D.seq.j++,client:s.client,desc:s.desc,workers:s.workers.slice(),when:d+'T'+(s.time||'08:00'),status:'Scheduled',quote:'',recurring:s.id,checklist:(s.checklist||[]).map(x=>({t:x.t,done:false}))});n++}});s.lastGen=to});if(n||D.recurring.some(s=>s.active))save();return n}

function invCost(i){const j=J(i.job);if(j){const f=jobFin(j);return{cost:f.cost,parts:f.parts,lab:f.lab,known:f.cost>0,src:'job'}}
 const parts=(i.items||[]).filter(x=>x.type=='part').reduce((s,x)=>s+(+x.qty||0)*(x.cost!=null?+x.cost:(+P(x.partId)?.cost||0)),0),lab=(i.items||[]).filter(x=>x.type=='labor').reduce((s,x)=>s+(+x.qty||0),0)*laborCostRate();
 return{cost:parts+lab,parts,lab,known:parts+lab>0,src:'invoice'}}
function profitData(){const live=D.invoices.filter(i=>i.status!='Draft'),drafts=D.invoices.filter(i=>i.status=='Draft');
 const rows=live.map(i=>{const t=invT(i),c=invCost(i);return{i,inv:t.sub,col:t.paid,c}});

 const bm={};rows.forEach(r=>{const m=(r.i.date||'').slice(0,7)||'No date';(bm[m]=bm[m]||{i:0,k:0,n:0,c:0}).i+=r.inv;bm[m].k+=r.c.cost;bm[m].n++});
 D.invoices.forEach(i=>(i.payments||[]).forEach(p=>{const m=(p.date||'').slice(0,7)||'No date';(bm[m]=bm[m]||{i:0,k:0,n:0,c:0}).c+=+p.amount||0}));
 const noCost=rows.filter(r=>!r.c.known).length;
 return `<div class="card noprint"><h2>Profit report <small style="color:var(--m);font-weight:400;font-size:12px">owner only</small></h2>
 <p style="font-size:13px;color:var(--m);margin:0 0 10px">Counts every invoice that's been <b>sent or paid</b>, even ones not linked to a job or quote. <b>Invoiced</b> = invoice amounts before tax. <b>Collected</b> = payments actually received (incl. tax). <b>Cost</b> = parts (actual paid if entered on the job, otherwise the part cost on the quote/invoice) + clocked labor at each worker's cost. Draft invoices are <b>not counted</b> until you mark them sent.</p>
 <div class="grid"><div class="stat card"><div class="n">${money(tI)}</div><div class="k">Invoiced (${rows.length})</div></div><div class="stat card"><div class="n">${money(tC)}</div><div class="k">Collected</div></div><div class="stat card"><div class="n">${money(tK)}</div><div class="k">Cost</div></div><div class="stat card"><div class="n" style="color:${tI-tK<0?'#c0392b':'#1e8e4e'}">${money(tI-tK)}</div><div class="k">Profit · ${pct(tI,tK)}</div></div></div>
 ${noCost?`<p style="font-size:12px;color:#8a5a00;background:#fff6e5;border-radius:6px;padding:6px 8px">⚠ ${noCost} invoice${noCost>1?'s have':' has'} no cost info, so it counts as $0 cost (100% profit). Add part costs on the invoice or link it to a job for real numbers.</p>`:''}
 ${drafts.length?`<p style="font-size:12px;color:var(--m)">📝 ${drafts.length} draft invoice${drafts.length>1?'s':''} (${money(drafts.reduce((s,i)=>s+invT(i).sub,0))}) not counted yet: ${drafts.map(i=>`<a href="#" onclick="viewInvoice('${i.id}');return false">${esc(i.num)}</a>`).join(', ')}</p>`:''}
 <h3 style="font-size:15px">By month</h3><div class="tw"><table><tr><th>Month</th><th class="right">Invoiced</th><th class="right">Collected</th><th class="right">Cost</th><th class="right">Profit</th><th class="right">Margin</th></tr>${Object.keys(bm).sort().reverse().map(m=>{const x=bm[m];return `<tr><td>${m}</td><td class="right">${money(x.i)}</td><td class="right">${money(x.c)}</td><td class="right">${money(x.k)}</td><td class="right">${money(x.i-x.k)}</td><td class="right">${pct(x.i,x.k)}</td></tr>`}).join('')||'<tr><td colspan=6>No sent invoices yet.</td></tr>'}</table></div>
 <h3 style="font-size:15px">By invoice</h3><div class="tw"><table><tr><th>Invoice</th><th>Client</th><th class="right">Invoiced</th><th class="right">Collected</th><th class="right">Cost</th><th class="right">Profit</th></tr>${rows.slice().sort((a,b)=>(b.i.date||'').localeCompare(a.i.date||'')).map(r=>`<tr><td><a href="#" onclick="viewInvoice('${r.i.id}');return false">${esc(r.i.num)}</a> <span class="pill ${invStatus(r.i)}">${invStatus(r.i)}</span>${r.i.job&&J(r.i.job)?`<br><small>${esc(J(r.i.job).num)}</small>`:'<br><small style="color:var(--m)">no job</small>'}</td><td>${cname(r.i.client)}</td><td class="right">${money(r.inv)}</td><td class="right">${money(r.col)}</td><td class="right">${money(r.c.cost)}${r.c.known?'':'<br><small style="color:#8a5a00">no cost info</small>'}</td><td class="right">${money(r.inv-r.c.cost)}<br><small>${pct(r.inv,r.c.cost)}</small></td></tr>`).join('')||'<tr><td colspan=6>No sent invoices yet.</td></tr>'}</table></div>
 ${notInv.length?`<h3 style="font-size:15px">Jobs not invoiced yet <small style="color:var(--m);font-weight:400">(not in totals)</small></h3><div class="tw"><table><tr><th>Job</th><th>Client</th><th class="right">Quoted</th><th class="right">Cost so far</th></tr>${notInv.map(({j,f})=>`<tr><td><a href="#" onclick="editJob('${j.id}');return false">${esc(j.num)}</a>${tag(j)}</td><td>${cname(j.client)}</td><td class="right">${money(f.price)}</td><td class="right">${money(f.cost)}</td></tr>`).join('')}</table></div>`:''}</div>`}
{const _vd=V.dash;V.dash=()=>{let h=_vd();if(isTech())return h;const k='<div class="card noprint"><h2>Profit report';const i=h.indexOf(k);if(i>=0)h=h.slice(0,i);return h+profitReport()}}

 let pos=0,c=0;if(before>0){for(;pos<nv.length;pos++){if(/\d/.test(nv[pos])&&++c==before){pos++;break}}}

    if(role==='owner'){
      for(const k in SPEC){listenCol(k,F.collection(co,SPEC[k].c));if(SPEC[k].priv)listenCol(k,F.collection(co,SPEC[k].c+'_private'),true)}
      unsubs.push(F.onSnapshot(metaRef,{includeMetadataChanges:true},s=>{if(!s.exists())return;const D=getD(),m=s.data();if(m.settings)D.settings=m.settings;if(m.seq)D.seq=Object.assign({i:1001},m.seq);last.meta=stable(meta(D));apply(D,s)},err));
    }else if(role==='billing'){ // read-only hours: all time entries, worker names, and job number + customer name only
      listenCol('workers',F.collection(co,'workers'));
      listenCol('time',F.collection(co,'timeEntries'));
      listenCol('jobs',F.collection(co,'billingJobs'));
      unsubs.push(F.onSnapshot(pubRef,s=>{if(!s.exists())return;const D=getD();Object.assign(D.settings,s.data());apply(D,s)},err));
    }else{
      listenCol('workers',F.collection(co,'workers'));
      listenCol('jobs',F.query(F.collection(co,'jobs'),F.where('techEmails','array-contains',me)));
      listenCol('time',F.query(F.collection(co,'timeEntries'),F.where('email','==',me)));
      listenCol('checklistTemplates',F.collection(co,'checklistTemplates'));
      listenCol('notes',F.query(F.collection(co,'notes'),F.where('techEmails','array-contains',me)));
      listenCol('leads',F.query(F.collection(co,'leads'),F.where('by','==',me)));
      unsubs.push(F.onSnapshot(pubRef,s=>{if(!s.exists())return;const D=getD();Object.assign(D.settings,s.data());apply(D,s)},err));
    }
  }
  function apply(D,s){applying=true;setD(D);applying=false;st.textContent=s.metadata.fromCache?'● offline (cached)':(s.metadata.hasPendingWrites?'● syncing…':'● live');rerender();$('#cname').innerHTML='<img src="logo-mono-white.png" alt="" class="hlogo">'+esc(!D.settings.company||D.settings.company=='Your Plumbing Co.'?'Central Plumbing':D.settings.company)}
  function err(e){st.textContent='⚠ '+nice(e);console.warn(e);if(e.code=='permission-denied'&&role!=='owner'){alert('Access problem: '+nice(e));A.signOut(auth)}}

  // Firestore-backed photo store: photos/{id} (meta) + photos/{id}/chunks/{n} (base64 pieces < 1MB each)
  const CH=700000;
  const fsPhotos={
    async list(jid){const c=F.collection(co,'photos');const q=role==='owner'?F.query(c,F.where('jobId','==',jid)):F.query(c,F.where('jobId','==',jid),F.where('techEmails','array-contains',me));return (await F.getDocs(q)).docs.map(d=>({id:d.id,...d.data()}))},
    async get(p){const s=await F.getDocs(F.collection(co,'photos',p.id,'chunks'));return s.docs.sort((a,b)=>+a.id-+b.id).map(d=>d.data().d).join('')},
    async add(j,tag,data){const id=Math.random().toString(36).slice(2,12),n=Math.ceil(data.length/CH),wb=F.writeBatch(db),te=(j.techEmails||[]).slice();if(role!=='owner'&&!te.includes(me))te.push(me);
      wb.set(F.doc(co,'photos',id),{jobId:j.id,tag,by:me,byName:(window.phName?phName():me),at:new Date().toISOString(),n,techEmails:te});for(let i=0;i<n;i++)wb.set(F.doc(co,'photos',id,'chunks',String(i)),{d:data.slice(i*CH,(i+1)*CH)});await wb.commit();return {id}},
    async del(p){const wb=F.writeBatch(db);for(let i=0;i<(p.n||1);i++)wb.delete(F.doc(co,'photos',p.id,'chunks',String(i)));wb.delete(F.doc(co,'photos',p.id));await wb.commit()}
  };

  async function loadAllOwner(){const D=norm(blank());let any=false;
    for(const k in SPEC){const pub=await F.getDocs(F.collection(co,SPEC[k].c));let priv={};if(SPEC[k].priv){(await F.getDocs(F.collection(co,SPEC[k].c+'_private'))).docs.forEach(d=>priv[d.id]=d.data())}
      D[k]=pub.docs.map(d=>Object.assign({},d.data(),priv[d.id]||{}));if(pub.size)any=true}
    try{const bj=await F.getDocs(F.collection(co,'billingJobs'));last.bj={};bj.docs.forEach(d=>last.bj[d.id]=stable(d.data()))}catch(e){}
    const ms=await F.getDoc(metaRef);if(ms.exists()){any=true;const m=ms.data();if(m.settings)D.settings=m.settings;if(m.seq)D.seq=Object.assign({i:1001},m.seq)}
    return {D,empty:!any,schema:ms.exists()?(ms.data().schema||1):0}}

  A.onAuthStateChanged(auth,async u=>{
    unsubs.forEach(x=>x());unsubs=[];ready=false;role=null;
    window.userEmail=u?u.email:null;window.userRole=null;window.userWorkerId=null;
    window.cpPush=null;
    if(!u){window.photoStore=window.localPhotoStore;showLogin();return}
    me=u.email.toLowerCase();body.innerHTML='<p style="color:var(--m)">Loading company data…</p>';
    try{
      let workerId=null;if((window.OWNER_LIST||[]).includes(me))role='owner';
      try{const ud=await F.getDoc(F.doc(co,'users',me));if(ud.exists()){const x=ud.data();if(!role)role=x.role==='owner'?'owner':x.role==='billing'?'billing':'tech';workerId=x.workerId||null}}catch(e){if(!role)throw e}
      if(!role){showLogin('This account ('+u.email+') is not on the team. Ask an owner to add you in Team.');await A.signOut(auth);return}
      window.userRole=role;window.userWorkerId=workerId;window.photoStore=fsPhotos;
      const subId=async ep=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ep)))).slice(0,20).map(b=>b.toString(16).padStart(2,'0')).join('');
      window.cpPush={ // device subscriptions: companies/main/pushSubs/{hash(endpoint)}; prefs: companies/main/pushPrefs/{email}
        async saveSub(s){await F.setDoc(F.doc(co,'pushSubs',await subId(s.endpoint)),{email:me,role,endpoint:s.endpoint,keys:{p256dh:s.keys.p256dh,auth:s.keys.auth},ua:navigator.userAgent.slice(0,200),at:new Date().toISOString()})},
        async delSub(ep){await F.deleteDoc(F.doc(co,'pushSubs',await subId(ep)))},
        async getPrefs(){const d=await F.getDoc(F.doc(co,'pushPrefs',me));return d.exists()?d.data():{}},
        async setPrefs(p){await F.setDoc(F.doc(co,'pushPrefs',me),Object.assign({},p,{email:me,at:new Date().toISOString()}))}};
      if(role==='owner'){
        const r=await loadAllOwner();
        if(r.empty){const D=getD(),n=Object.keys(SPEC).reduce((a,k)=>a+(D[k]||[]).filter(x=>!x.sample).length,0);
          if(n&&!confirm(`The shared company account is empty.\n\nUpload the ${n} record(s) saved on this device so everyone can see them?\n\nOK = upload  ·  Cancel = start fresh`)){const b=norm(blank());b.settings=D.settings;setD(b)}
          derive();await push(true);
        }else{setD(r.D);snapLast(getD());derive();
          if(r.schema<SCHEMA){st.textContent='● upgrading data…';await push(true)} // migration: split private fields out of public docs, add techEmails etc.
        }
        ready=true;await push();window.onDataReady&&window.onDataReady();
      }else{setD(norm(blank()));ready=true}
      listen();window.onUserChange&&window.onUserChange();
      $('#auth').style.display='none';$('#signout').style.display='';$('#signout').title=u.email+' ('+role+')';
    }catch(e){console.warn(e);if(e.code=='permission-denied'){showLogin('This account ('+u.email+') is not allowed to access company data.');A.signOut(auth)}else showLogin('Error: '+nice(e))}
  });
}
</script></body></html>
