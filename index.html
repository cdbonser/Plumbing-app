<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plumbing Ops</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#08427c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Plumbing Ops"><link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--b:#0b5cad;--bd:#08427c;--bg:#f3f6fa;--c:#fff;--t:#1d2733;--m:#66768a;--l:#dde3ea}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--bd);color:#fff;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}nav{display:flex;gap:4px;overflow-x:auto;background:var(--b);padding:6px}
nav button{background:none;border:0;color:#dbe8f7;padding:8px 12px;border-radius:6px;font-size:14px;white-space:nowrap;cursor:pointer}
nav button.on{background:#fff;color:var(--bd);font-weight:600}
main{max-width:1100px;margin:auto;padding:16px}.card{background:var(--c);border:1px solid var(--l);border-radius:10px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.stat .n{font-size:28px;font-weight:700;color:var(--b)}.stat .k{color:var(--m);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--l)}th{color:var(--m);font-weight:600;font-size:12px;text-transform:uppercase}
.tw{overflow-x:auto}button.btn,.btn{background:var(--b);color:#fff;border:0;border-radius:6px;padding:9px 14px;font-size:14px;cursor:pointer;margin:2px}
.btn.s{background:#e7edf4;color:var(--t)}.btn.d{background:#c0392b}.btn.g{background:#1e8e4e}.btn.sm{padding:5px 9px;font-size:12px}
input,select,textarea{width:100%;padding:9px;border:1px solid #c5cfda;border-radius:6px;font-size:15px;font-family:inherit}label{display:block;font-size:12px;color:var(--m);margin:8px 0 3px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#e7edf4}
.Scheduled,.Draft{background:#e7edf4}.In.Progress,.Sent{background:#fff1c9}.Completed,.Approved{background:#d4f3df}.Invoiced{background:#dde8ff}.Paid{background:#c7f0d8}.Declined{background:#f9d6d2}
.sample{font-size:10px;background:#ffe2a8;padding:1px 5px;border-radius:4px;margin-left:4px}h2{margin:0 0 10px;font-size:18px}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 8px;z-index:9}.modal>div{background:#fff;border-radius:10px;padding:18px;width:100%;max-width:760px}
.clk{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--l);flex-wrap:wrap}.on-clock{color:#1e8e4e;font-weight:600}
.qv{max-width:800px;margin:auto;background:#fff;padding:32px;border:1px solid var(--l)}.qv .tot td{font-weight:700}.right{text-align:right}
@media print{header,nav,.noprint{display:none!important}main{padding:0}.qv{border:0}body{background:#fff}}
</style></head><body>
<header><h1 id="cname">Plumbing Ops</h1><span style="font-size:12px;opacity:.8" id="today"></span></header>
<nav id="nav"></nav><main id="app"></main><div id="modal"></div>
<script>
const K='plumbingAppData_v1';const TABS=[['dash','Dashboard'],['clock','Time Clock'],['jobs','Jobs'],['quotes','Quotes'],['clients','Clients'],['workers','Workers'],['sheets','Timesheets'],['settings','Settings']];
const JS=['Scheduled','In Progress','Completed','Invoiced','Paid'],QS=['Draft','Sent','Approved','Declined'];
let D,tab='dash',view=null;const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(+n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dtl=d=>{d=new Date(d);return ymd(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const hrs=e=>((e.out?new Date(e.out):new Date())-new Date(e.in))/36e5;const fmtDT=d=>d?new Date(d).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
function weekStart(d){d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function blank(){return{settings:{company:'Your Plumbing Co.',rate:95,fee:89,tax:7.5,phone:'',email:''},workers:[],clients:[],quotes:[],jobs:[],time:[],seq:{q:1001,j:1001}}}
function load(){try{D=JSON.parse(localStorage.getItem(K))}catch(e){}if(!D){D=blank();seed()}}
function save(){localStorage.setItem(K,JSON.stringify(D))}
const W=id=>D.workers.find(x=>x.id==id),C=id=>D.clients.find(x=>x.id==id),Q=id=>D.quotes.find(x=>x.id==id),J=id=>D.jobs.find(x=>x.id==id);
function seed(){const S=true,now=new Date(),day=n=>{const d=new Date(now);d.setDate(d.getDate()+n);return d};
 const w1={id:uid(),name:'Sample - Mike Torres',rate:32,sample:S},w2={id:uid(),name:'Sample - Dana Kealoha',rate:28,sample:S};D.workers.push(w1,w2);
 const c1={id:uid(),name:'Sample - Smith Residence',phone:'(308) 555-0142',address:'412 G St, Central City, NE',email:'',sample:S},c2={id:uid(),name:'Sample - Main St Diner',phone:'(308) 555-0199',address:'1601 17th St, Central City, NE',email:'',sample:S};D.clients.push(c1,c2);
 const q1={id:uid(),num:'Q-'+D.seq.q++,client:c1.id,date:ymd(now),status:'Approved',tax:D.settings.tax,notes:'Replace 50-gal gas water heater. Includes haul-away of old unit.',items:[{type:'fee',desc:'Service call / trip fee',qty:1,price:89},{type:'labor',desc:'Install labor',qty:4,price:95},{type:'part',desc:'50-gal gas water heater',qty:1,price:899},{type:'part',desc:'Flex connectors & fittings',qty:1,price:64.5}],sample:S};
 const q2={id:uid(),num:'Q-'+D.seq.q++,client:c2.id,date:ymd(now),status:'Sent',tax:D.settings.tax,notes:'Grease trap cleanout and kitchen drain jetting.',items:[{type:'fee',desc:'Service call / trip fee',qty:1,price:89},{type:'labor',desc:'Jetting labor',qty:3,price:95},{type:'part',desc:'Jetter rental',qty:1,price:150}],sample:S};D.quotes.push(q1,q2);
 const j1={id:uid(),num:'J-'+D.seq.j++,client:c1.id,desc:'Water heater replacement',workers:[w1.id,w2.id],when:dtl(new Date(now.setHours(9,0,0,0))),status:'In Progress',quote:q1.id,sample:S};
 const j2={id:uid(),num:'J-'+D.seq.j++,client:c2.id,desc:'Leaking faucet & slow drain',workers:[w2.id],when:dtl(new Date(day(2).setHours(13,30,0,0))),status:'Scheduled',quote:'',sample:S};D.jobs.push(j1,j2);
 const ws=weekStart(new Date());for(let i=0;i<3;i++){const d=new Date(ws);d.setDate(d.getDate()+i);if(d>new Date())break;const a=new Date(d);a.setHours(8,0);const b=new Date(d);b.setHours(16,30);D.time.push({id:uid(),worker:w1.id,job:j1.id,in:a.toISOString(),out:b.toISOString(),sample:S});const a2=new Date(d);a2.setHours(9,0);const b2=new Date(d);b2.setHours(15,0);D.time.push({id:uid(),worker:w2.id,job:i?j1.id:'',in:a2.toISOString(),out:b2.toISOString(),sample:S})}
 save()}
function clearSample(){if(!confirm('Remove all sample data?'))return;['workers','clients','quotes','jobs','time'].forEach(k=>D[k]=D[k].filter(x=>!x.sample));save();render()}
const tag=x=>x&&x.sample?'<span class="sample">SAMPLE</span>':'';
const qTotals=q=>{const sub=q.items.reduce((s,i)=>s+(+i.qty||0)*(+i.price||0),0),taxable=q.items.filter(i=>i.type=='part').reduce((s,i)=>s+i.qty*i.price,0);const tax=sub*(+q.tax||0)/100;return{sub,tax,total:sub+tax}};
const jobHours=id=>D.time.filter(t=>t.job==id).reduce((s,t)=>s+hrs(t),0);
const cname=id=>{const c=C(id);return c?esc(c.name):'<i>—</i>'};
function render(){$('#cname').textContent=D.settings.company||'Plumbing Ops';$('#today').textContent=new Date().toDateString();
 $('#nav').innerHTML=TABS.map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${v}</button>`).join('');$('#app').innerHTML=(V[tab]||V.dash)()}
function go(t){tab=t;view=null;render();scrollTo(0,0)}
function modal(h){$('#modal').innerHTML=h?`<div class="modal" onclick="if(event.target==this)modal()"><div>${h}</div></div>`:''}
const opt=(arr,sel,blankLbl)=>(blankLbl!=null?`<option value="">${blankLbl}</option>`:'')+arr.map(([v,l])=>`<option value="${esc(v)}" ${v==sel?'selected':''}>${esc(l)}</option>`).join('');
const V={};
V.dash=()=>{const t=ymd(new Date()),ws=weekStart(new Date());const open=D.jobs.filter(j=>['Scheduled','In Progress'].includes(j.status)),today=D.jobs.filter(j=>j.when&&j.when.slice(0,10)==t);
 const wh=D.time.filter(e=>new Date(e.in)>=ws).reduce((s,e)=>s+hrs(e),0),pend=D.quotes.filter(q=>['Draft','Sent'].includes(q.status));const pt=pend.reduce((s,q)=>s+qTotals(q).total,0);
 const on=D.time.filter(e=>!e.out);
 return `<div class="grid"><div class="card stat"><div class="n">${open.length}</div><div class="k">Open jobs</div></div><div class="card stat"><div class="n">${today.length}</div><div class="k">Jobs today</div></div><div class="card stat"><div class="n">${wh.toFixed(1)}</div><div class="k">Hours this week</div></div><div class="card stat"><div class="n">${money(pt)}</div><div class="k">Pending quotes (${pend.length})</div></div></div>
 <div class="card"><h2>Today's jobs</h2>${jobTable(today)}</div><div class="card"><h2>On the clock now</h2>${on.length?on.map(e=>`<div>${esc(W(e.worker)?.name)} — since ${fmtDT(e.in)} ${e.job?'· '+esc(J(e.job)?.num):''}</div>`).join(''):'<span style="color:var(--m)">Nobody clocked in.</span>'}</div>
 <div class="card noprint"><button class="btn" onclick="go('quotes');editQuote()">+ New quote</button><button class="btn" onclick="go('jobs');editJob()">+ New job</button><button class="btn s" onclick="go('clock')">Time clock</button></div>`};
function jobTable(list){if(!list.length)return '<span style="color:var(--m)">No jobs.</span>';return `<div class="tw"><table><tr><th>Job</th><th>Client</th><th>When</th><th>Workers</th><th>Status</th><th>Hours</th><th></th></tr>${list.sort((a,b)=>(a.when||'').localeCompare(b.when||'')).map(j=>`<tr><td>${esc(j.num)}${tag(j)}<br><small>${esc(j.desc)}</small></td><td>${cname(j.client)}</td><td>${fmtDT(j.when)}</td><td>${j.workers.map(w=>esc(W(w)?.name||'')).join(', ')}</td><td><span class="pill ${j.status}">${j.status}</span></td><td>${jobHours(j.id).toFixed(1)}</td><td><button class="btn sm s" onclick="editJob('${j.id}')">Open</button></td></tr>`).join('')}</table></div>`}
let jf={status:'',worker:'',range:'all',date:''};
V.jobs=()=>{let L=D.jobs.slice();const t=ymd(new Date()),ws=weekStart(new Date()),we=new Date(ws);we.setDate(we.getDate()+7);
 if(jf.status)L=L.filter(j=>j.status==jf.status);if(jf.worker)L=L.filter(j=>j.workers.includes(jf.worker));
 if(jf.range=='today')L=L.filter(j=>j.when&&j.when.slice(0,10)==t);if(jf.range=='week')L=L.filter(j=>j.when&&new Date(j.when)>=ws&&new Date(j.when)<we);if(jf.date)L=L.filter(j=>j.when&&j.when.slice(0,10)==jf.date);
 return `<div class="card"><div class="row" style="align-items:end"><div><label>Status</label><select onchange="jf.status=this.value;render()">${opt(JS.map(s=>[s,s]),jf.status,'All')}</select></div><div><label>Worker</label><select onchange="jf.worker=this.value;render()">${opt(D.workers.map(w=>[w.id,w.name]),jf.worker,'All')}</select></div><div><label>View</label><select onchange="jf.range=this.value;render()">${opt([['all','All dates'],['today','Today'],['week','This week']],jf.range)}</select></div><div><label>Date</label><input type="date" value="${jf.date}" onchange="jf.date=this.value;render()"></div><div style="flex:0"><button class="btn" onclick="editJob()">+ Job</button></div></div></div><div class="card">${jobTable(L)}</div>`};
function editJob(id,fromQuote){const j=id?J(id):Object.assign({id:'',num:'',client:'',desc:'',workers:[],when:'',status:'Scheduled',quote:''},fromQuote||{});
 const te=id?D.time.filter(t=>t.job==id):[];
 modal(`<h2>${id?'Job '+esc(j.num):'New job'}</h2>${clientPicker(j.client)}<label>Description</label><textarea id="jd" rows="2">${esc(j.desc)}</textarea>
 <div class="row"><div><label>Scheduled</label><input id="jw" type="datetime-local" value="${j.when||''}"></div><div><label>Status</label><select id="js">${opt(JS.map(s=>[s,s]),j.status)}</select></div><div><label>Linked quote</label><select id="jq">${opt(D.quotes.map(q=>[q.id,q.num+' · '+(C(q.client)?.name||'')]),j.quote,'None')}</select></div></div>
 <label>Assigned workers</label><div>${D.workers.map(w=>`<label style="display:inline-flex;gap:4px;margin-right:12px;color:var(--t);font-size:14px"><input type="checkbox" style="width:auto" class="jwk" value="${w.id}" ${j.workers.includes(w.id)?'checked':''}>${esc(w.name)}</label>`).join('')||'<i>Add workers first</i>'}</div>
 ${id?`<h3 style="font-size:15px">Hours logged: ${jobHours(id).toFixed(2)} · Labor cost ${money(te.reduce((s,t)=>s+hrs(t)*(W(t.worker)?.rate||0),0))}</h3><div class="tw"><table>${te.map(t=>`<tr><td>${esc(W(t.worker)?.name)}</td><td>${fmtDT(t.in)} – ${t.out?fmtDT(t.out):'<b class="on-clock">on clock</b>'}</td><td>${hrs(t).toFixed(2)}h</td></tr>`).join('')}</table></div>`:''}
 <div style="margin-top:14px"><button class="btn" onclick="saveJob('${id||''}')">Save</button>${j.quote?`<button class="btn s" onclick="modal();viewQuote('${j.quote}')">View quote</button>`:''}${id?`<button class="btn d" onclick="if(confirm('Delete job?')){D.jobs=D.jobs.filter(x=>x.id!='${id}');save();modal();render()}">Delete</button>`:''}<button class="btn s" onclick="modal()">Cancel</button></div>`)}
function clientPicker(sel){return `<div class="row"><div><label>Client</label><select id="cl" onchange="document.getElementById('nc').style.display=this.value=='__new'?'flex':'none'">${opt(D.clients.map(c=>[c.id,c.name]),sel,'— choose —')}<option value="__new">+ New client…</option></select></div></div><div id="nc" class="row" style="display:none"><div><label>Name</label><input id="ncn"></div><div><label>Phone</label><input id="ncp" type="tel"></div><div><label>Address</label><input id="nca"></div></div>`}
function pickClient(){let v=$('#cl').value;if(v=='__new'){const n=$('#ncn').value.trim();if(!n){alert('Client name required');return null}const c={id:uid(),name:n,phone:$('#ncp').value,address:$('#nca').value,email:''};D.clients.push(c);v=c.id}if(!v){alert('Choose a client');return null}return v}
function saveJob(id){const cl=pickClient();if(!cl)return;let j=id?J(id):{id:uid(),num:'J-'+D.seq.j++};Object.assign(j,{client:cl,desc:$('#jd').value,when:$('#jw').value,status:$('#js').value,quote:$('#jq').value,workers:[...document.querySelectorAll('.jwk:checked')].map(x=>x.value)});if(!id)D.jobs.push(j);save();modal();render()}
V.quotes=()=>{if(view)return quoteDoc(Q(view));return `<div class="card"><button class="btn" onclick="editQuote()">+ New quote</button></div><div class="card"><div class="tw"><table><tr><th>Quote</th><th>Client</th><th>Date</th><th>Status</th><th class="right">Total</th><th></th></tr>${D.quotes.slice().reverse().map(q=>`<tr><td>${esc(q.num)}${tag(q)}</td><td>${cname(q.client)}</td><td>${q.date}</td><td><span class="pill ${q.status}">${q.status}</span></td><td class="right">${money(qTotals(q).total)}</td><td><button class="btn sm s" onclick="viewQuote('${q.id}')">View</button><button class="btn sm s" onclick="editQuote('${q.id}')">Edit</button></td></tr>`).join('')||'<tr><td colspan=6>No quotes yet.</td></tr>'}</table></div></div>`};
function viewQuote(id){tab='quotes';view=id;render();scrollTo(0,0)}
function quoteDoc(q){const t=qTotals(q),c=C(q.client)||{},s=D.settings,job=D.jobs.find(j=>j.quote==q.id);
 return `<div class="noprint card"><button class="btn s" onclick="view=null;render()">← Back</button><button class="btn" onclick="print()">Print / Save PDF</button><button class="btn s" onclick="editQuote('${q.id}')">Edit</button>${QS.map(st=>`<button class="btn sm ${st==q.status?'':'s'}" onclick="setQS('${q.id}','${st}')">${st}</button>`).join('')}${q.status=='Approved'?(job?`<button class="btn s" onclick="go('jobs');editJob('${job.id}')">Open job ${esc(job.num)}</button>`:`<button class="btn g" onclick="toJob('${q.id}')">Convert to job</button>`):''}</div>
 <div class="qv"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px"><div><div style="font-size:22px;font-weight:700;color:var(--bd)">${esc(s.company)}</div><div style="color:var(--m);font-size:13px">${esc(s.phone)} ${esc(s.email)}</div></div><div class="right"><div style="font-size:20px;font-weight:700">QUOTE</div><div>${esc(q.num)}</div><div style="color:var(--m)">${q.date}</div><span class="pill ${q.status} noprint">${q.status}</span></div></div>
 <div style="margin:22px 0"><div style="color:var(--m);font-size:12px">PREPARED FOR</div><b>${esc(c.name)}</b><br>${esc(c.address)}<br>${esc(c.phone)}</div>
 <table><tr><th>Description</th><th class="right">Qty/Hrs</th><th class="right">Rate</th><th class="right">Amount</th></tr>${q.items.map(i=>`<tr><td>${esc(i.desc)} <small style="color:var(--m)">(${{labor:'Labor',part:'Parts',fee:'Service fee'}[i.type]})</small></td><td class="right">${i.qty}</td><td class="right">${money(i.price)}</td><td class="right">${money(i.qty*i.price)}</td></tr>`).join('')}
 <tr><td colspan=3 class="right">Subtotal</td><td class="right">${money(t.sub)}</td></tr><tr><td colspan=3 class="right">Tax (${q.tax}%)</td><td class="right">${money(t.tax)}</td></tr><tr class="tot"><td colspan=3 class="right">Total</td><td class="right">${money(t.total)}</td></tr></table>
 ${q.notes?`<div style="margin-top:18px"><div style="color:var(--m);font-size:12px">NOTES</div>${esc(q.notes).replace(/\n/g,'<br>')}</div>`:''}<div style="margin-top:40px;color:var(--m);font-size:12px">Approved by: ______________________ Date: __________</div></div>`}
function setQS(id,s){Q(id).status=s;save();render()}
function toJob(id){const q=Q(id);go('jobs');editJob(null,{client:q.client,desc:q.notes||'From quote '+q.num,quote:q.id})}
let qi=[];
function editQuote(id){const q=id?Q(id):{client:'',date:ymd(new Date()),status:'Draft',tax:D.settings.tax,notes:'',items:[{type:'fee',desc:'Service call / trip fee',qty:1,price:D.settings.fee},{type:'labor',desc:'Labor',qty:1,price:D.settings.rate}]};qi=JSON.parse(JSON.stringify(q.items));
 modal(`<h2>${id?'Edit '+esc(q.num):'New quote'}</h2>${clientPicker(q.client)}<div class="row"><div><label>Date</label><input id="qd" type="date" value="${q.date}"></div><div><label>Status</label><select id="qs">${opt(QS.map(s=>[s,s]),q.status)}</select></div><div><label>Tax %</label><input id="qt" type="number" step="0.01" value="${q.tax}"></div></div>
 <label>Line items</label><div id="qitems"></div><div><button class="btn sm s" onclick="addLi('labor')">+ Labor</button><button class="btn sm s" onclick="addLi('part')">+ Part/material</button><button class="btn sm s" onclick="addLi('fee')">+ Service fee</button></div><div id="qtot" style="text-align:right;font-weight:700;margin:8px 0"></div>
 <label>Notes</label><textarea id="qn" rows="3">${esc(q.notes)}</textarea><div style="margin-top:14px"><button class="btn" onclick="saveQuote('${id||''}')">Save</button>${id?`<button class="btn d" onclick="if(confirm('Delete quote?')){D.quotes=D.quotes.filter(x=>x.id!='${id}');save();modal();view=null;render()}">Delete</button>`:''}<button class="btn s" onclick="modal()">Cancel</button></div>`);drawLi()}
function addLi(t){qi.push(t=='labor'?{type:t,desc:'Labor',qty:1,price:D.settings.rate}:t=='fee'?{type:t,desc:'Service call / trip fee',qty:1,price:D.settings.fee}:{type:t,desc:'',qty:1,price:0});drawLi()}
function drawLi(){$('#qitems').innerHTML=qi.map((i,n)=>`<div class="row" style="margin-bottom:6px;align-items:center"><select style="flex:0 0 105px;min-width:0" onchange="qi[${n}].type=this.value">${opt([['labor','Labor'],['part','Part'],['fee','Fee']],i.type)}</select><input style="flex:3" placeholder="Description" value="${esc(i.desc)}" oninput="qi[${n}].desc=this.value"><input style="flex:0 0 75px;min-width:0" type="number" step="0.25" title="${i.type=='labor'?'Hours':'Qty'}" value="${i.qty}" oninput="qi[${n}].qty=+this.value;qtot()"><input style="flex:0 0 95px;min-width:0" type="number" step="0.01" title="Rate/price" value="${i.price}" oninput="qi[${n}].price=+this.value;qtot()"><button class="btn sm d" style="flex:0" onclick="qi.splice(${n},1);drawLi()">✕</button></div>`).join('');qtot()}
function qtot(){const t=qTotals({items:qi,tax:+$('#qt').value});$('#qtot').textContent='Subtotal '+money(t.sub)+' · Tax '+money(t.tax)+' · Total '+money(t.total)}
function saveQuote(id){const cl=pickClient();if(!cl)return;let q=id?Q(id):{id:uid(),num:'Q-'+D.seq.q++};Object.assign(q,{client:cl,date:$('#qd').value,status:$('#qs').value,tax:+$('#qt').value,notes:$('#qn').value,items:qi});if(!id)D.quotes.push(q);save();modal();viewQuote(q.id)}
V.clock=()=>`<div class="card"><h2>Time clock</h2>${D.workers.map(w=>{const e=D.time.find(t=>t.worker==w.id&&!t.out);return `<div class="clk"><div><b>${esc(w.name)}</b>${tag(w)}<br>${e?`<span class="on-clock">On clock since ${fmtDT(e.in)} (${hrs(e).toFixed(2)}h)${e.job?' · '+esc(J(e.job)?.num):''}</span>`:'<small style="color:var(--m)">Off clock</small>'}</div><div style="display:flex;gap:6px;align-items:center">${e?`<button class="btn d" onclick="clockOut('${e.id}')">Clock out</button>`:`<select id="cj_${w.id}" style="width:auto;max-width:170px">${opt(D.jobs.filter(j=>j.status!='Paid').map(j=>[j.id,j.num+' '+(C(j.client)?.name||'')]),'','No job')}</select><button class="btn g" onclick="clockIn('${w.id}')">Clock in</button>`}</div></div>`}).join('')||'Add workers in the Workers tab.'}</div>
 <div class="card"><h2>Recent entries</h2>${timeTable(D.time.slice().sort((a,b)=>b.in.localeCompare(a.in)).slice(0,15))}<button class="btn s" onclick="editTime()">+ Manual entry</button></div>`;
function clockIn(w){D.time.push({id:uid(),worker:w,job:$('#cj_'+w).value,in:new Date().toISOString(),out:null});save();render()}
function clockOut(id){D.time.find(t=>t.id==id).out=new Date().toISOString();save();render()}
function timeTable(L){return L.length?`<div class="tw"><table><tr><th>Worker</th><th>Job</th><th>In</th><th>Out</th><th>Hours</th><th></th></tr>${L.map(t=>`<tr><td>${esc(W(t.worker)?.name)}${tag(t)}</td><td>${t.job?esc(J(t.job)?.num||''):'—'}</td><td>${fmtDT(t.in)}</td><td>${t.out?fmtDT(t.out):'<b class="on-clock">on clock</b>'}</td><td>${hrs(t).toFixed(2)}</td><td><button class="btn sm s" onclick="editTime('${t.id}')">Edit</button></td></tr>`).join('')}</table></div>`:'<span style="color:var(--m)">No entries.</span>'}
function editTime(id,wk){const t=id?D.time.find(x=>x.id==id):{worker:wk||D.workers[0]?.id,job:'',in:new Date().toISOString(),out:new Date().toISOString()};
 modal(`<h2>${id?'Edit':'Add'} time entry</h2><div class="row"><div><label>Worker</label><select id="tw">${opt(D.workers.map(w=>[w.id,w.name]),t.worker)}</select></div><div><label>Job</label><select id="tj">${opt(D.jobs.map(j=>[j.id,j.num+' '+(C(j.client)?.name||'')]),t.job,'No job')}</select></div></div><div class="row"><div><label>Clock in</label><input id="ti" type="datetime-local" value="${dtl(t.in)}"></div><div><label>Clock out (blank = still on clock)</label><input id="to" type="datetime-local" value="${t.out?dtl(t.out):''}"></div></div>
 <div style="margin-top:14px"><button class="btn" onclick="saveTime('${id||''}')">Save</button>${id?`<button class="btn d" onclick="D.time=D.time.filter(x=>x.id!='${id}');save();modal();render()">Delete</button>`:''}<button class="btn s" onclick="modal()">Cancel</button></div>`)}
function saveTime(id){const i=$('#ti').value,o=$('#to').value;if(!i)return alert('Clock-in time required');if(o&&new Date(o)<new Date(i))return alert('Clock out must be after clock in');let t=id?D.time.find(x=>x.id==id):{id:uid()};Object.assign(t,{worker:$('#tw').value,job:$('#tj').value,in:new Date(i).toISOString(),out:o?new Date(o).toISOString():null});if(!id)D.time.push(t);save();modal();render()}
let sw={worker:'',week:''};
V.sheets=()=>{if(!sw.week)sw.week=ymd(weekStart(new Date()));const ws=new Date(sw.week+'T00:00'),we=new Date(ws);we.setDate(we.getDate()+7);const ww=sw.worker?D.workers.filter(w=>w.id==sw.worker):D.workers;
 const shift=n=>{const d=new Date(ws);d.setDate(d.getDate()+n*7);return ymd(d)};
 return `<div class="card noprint"><div class="row" style="align-items:end"><div><label>Worker</label><select onchange="sw.worker=this.value;render()">${opt(D.workers.map(w=>[w.id,w.name]),sw.worker,'All workers')}</select></div><div><label>Week starting (Mon)</label><input type="date" value="${sw.week}" onchange="sw.week=ymd(weekStart(new Date(this.value+'T00:00')));render()"></div><div style="flex:2"><button class="btn s" onclick="sw.week='${shift(-1)}';render()">◀ Prev</button><button class="btn s" onclick="sw.week='${shift(1)}';render()">Next ▶</button><button class="btn" onclick="exportCSV()">Export CSV</button><button class="btn s" onclick="print()">Print</button></div></div></div>
 ${ww.map(w=>{const L=D.time.filter(t=>t.worker==w.id&&new Date(t.in)>=ws&&new Date(t.in)<we).sort((a,b)=>a.in.localeCompare(b.in));const days=[...Array(7)].map((_,i)=>{const d=new Date(ws);d.setDate(d.getDate()+i);return d});const tot=L.reduce((s,t)=>s+hrs(t),0);
 return `<div class="card"><h2>${esc(w.name)}${tag(w)} <small style="color:var(--m);font-weight:400">· ${money(w.rate)}/hr · week of ${ws.toLocaleDateString()}</small></h2><div class="tw"><table><tr>${days.map(d=>`<th>${d.toLocaleDateString([], {weekday:'short',month:'numeric',day:'numeric'})}</th>`).join('')}<th>Total</th></tr><tr>${days.map(d=>`<td>${L.filter(t=>ymd(t.in)==ymd(d)).reduce((s,t)=>s+hrs(t),0).toFixed(2)}</td>`).join('')}<td><b>${tot.toFixed(2)}</b></td></tr></table></div>
 <div style="margin:10px 0;font-size:15px"><b>Total hours: ${tot.toFixed(2)}</b> · <b>Labor cost: ${money(tot*w.rate)}</b></div><details><summary style="cursor:pointer;color:var(--b)">Entries (${L.length})</summary>${timeTable(L)}<button class="btn sm s noprint" onclick="editTime(null,'${w.id}')">+ Add entry</button></details></div>`}).join('')||'<div class="card">No workers yet.</div>'}`};
function dl(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
function exportCSV(){const ws=new Date(sw.week+'T00:00'),we=new Date(ws);we.setDate(we.getDate()+7);const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
 const rows=[['Worker','Rate','Date','Clock In','Clock Out','Hours','Labor Cost','Job','Client']];D.time.filter(t=>(!sw.worker||t.worker==sw.worker)&&new Date(t.in)>=ws&&new Date(t.in)<we).sort((a,b)=>a.in.localeCompare(b.in)).forEach(t=>{const w=W(t.worker)||{},j=J(t.job);rows.push([w.name,w.rate,ymd(t.in),new Date(t.in).toLocaleTimeString(),t.out?new Date(t.out).toLocaleTimeString():'ON CLOCK',hrs(t).toFixed(2),(hrs(t)*(w.rate||0)).toFixed(2),j?.num||'',j?C(j.client)?.name:''])});
 dl('timesheet_'+sw.week+'.csv',rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv')}
V.workers=()=>`<div class="card"><h2>Workers</h2><div class="row" style="align-items:end"><div><label>Name</label><input id="wn"></div><div><label>Hourly rate ($)</label><input id="wr" type="number" step="0.01"></div><div style="flex:0"><button class="btn" onclick="addWorker()">Add</button></div></div></div><div class="card"><div class="tw"><table><tr><th>Name</th><th>Rate</th><th>Hours this week</th><th></th></tr>${D.workers.map(w=>`<tr><td><input value="${esc(w.name)}" onchange="W('${w.id}').name=this.value;save()">${tag(w)}</td><td><input type="number" step="0.01" style="max-width:110px" value="${w.rate}" onchange="W('${w.id}').rate=+this.value;save()"></td><td>${D.time.filter(t=>t.worker==w.id&&new Date(t.in)>=weekStart(new Date())).reduce((s,t)=>s+hrs(t),0).toFixed(2)}</td><td><button class="btn sm d" onclick="if(confirm('Remove worker? Time entries stay.')){D.workers=D.workers.filter(x=>x.id!='${w.id}');save();render()}">Remove</button></td></tr>`).join('')}</table></div></div>`;
function addWorker(){const n=$('#wn').value.trim();if(!n)return alert('Name required');D.workers.push({id:uid(),name:n,rate:+$('#wr').value||0});save();render()}
V.clients=()=>`<div class="card"><h2>Clients</h2><div class="row" style="align-items:end"><div><label>Name</label><input id="cn"></div><div><label>Phone</label><input id="cp" type="tel"></div><div><label>Address</label><input id="ca"></div><div style="flex:0"><button class="btn" onclick="addClient()">Add</button></div></div></div><div class="card"><div class="tw"><table><tr><th>Name</th><th>Phone</th><th>Address</th><th>Jobs</th><th></th></tr>${D.clients.map(c=>`<tr><td><input value="${esc(c.name)}" onchange="C('${c.id}').name=this.value;save()">${tag(c)}</td><td><input value="${esc(c.phone)}" onchange="C('${c.id}').phone=this.value;save()"></td><td><input value="${esc(c.address)}" onchange="C('${c.id}').address=this.value;save()"></td><td>${D.jobs.filter(j=>j.client==c.id).length}</td><td>${c.phone?`<a class="btn sm s" href="tel:${esc(c.phone)}">Call</a>`:''}<button class="btn sm d" onclick="if(confirm('Delete client?')){D.clients=D.clients.filter(x=>x.id!='${c.id}');save();render()}">✕</button></td></tr>`).join('')}</table></div></div>`;
function addClient(){const n=$('#cn').value.trim();if(!n)return alert('Name required');D.clients.push({id:uid(),name:n,phone:$('#cp').value,address:$('#ca').value});save();render()}
V.settings=()=>{const s=D.settings;const f=(k,l,t='text')=>`<div><label>${l}</label><input type="${t}" step="0.01" value="${esc(s[k])}" onchange="D.settings.${k}=this.type=='number'?+this.value:this.value;save();render()"></div>`;
 return `<div class="card"><h2>Company settings</h2><div class="row">${f('company','Company name')}${f('phone','Phone')}${f('email','Email')}</div><div class="row">${f('rate','Default labor rate ($/hr)','number')}${f('fee','Service call / trip fee ($)','number')}${f('tax','Tax rate (%)','number')}</div></div>
 <div class="card"><h2>Backup</h2><p style="color:var(--m);font-size:14px">Data is stored only in this browser on this device. Export a backup regularly.</p><button class="btn" onclick="dl('plumbing-backup-'+ymd(new Date())+'.json',JSON.stringify(D,null,1),'application/json')">Export JSON backup</button><label class="btn s" style="display:inline-block">Import backup<input type="file" accept=".json" style="display:none" onchange="importJSON(this.files[0])"></label></div>
 <div class="card"><h2>Sample data</h2><button class="btn s" onclick="clearSample()">Clear sample data</button><button class="btn s" onclick="seed();render()">Re-add sample data</button><button class="btn d" onclick="if(confirm('Erase ALL data?')){D=blank();save();render()}">Erase everything</button></div>`};
function importJSON(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.settings||!x.jobs)throw 0;if(confirm('Replace current data with backup?')){D=x;save();render()}}catch(e){alert('Not a valid backup file')}};r.readAsText(f)}
load();render();setInterval(()=>{if(!$('#modal').innerHTML&&(tab=='clock'||tab=='dash'))render()},60000);
</script></body></html>
