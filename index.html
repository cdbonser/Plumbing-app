{const _eq=editQuote;editQuote=function(id){_eq(id);const box=$('#qitems');if(!box)return;box.insertAdjacentHTML('beforebegin',`<div class="row noprint" style="margin-bottom:8px;background:#f6eaeb;padding:8px;border-radius:8px"><select id="qtpl">${opt(D.templates.map(t=>[t.id,t.name+' · '+money(tmplPrice(t))]),'','— Start from template —')}</select><button class="btn sm" style="flex:0" onclick="applyTmpl()">Add template</button></div>`);

function occDates(s,to){const out=[],st=new Date(s.start+'T00:00');for(let k=0;k<2000;k++){let d;if(s.unit=='week'){d=new Date(st);d.setDate(d.getDate()+7*s.every*k)}else{const mm=s.unit=='month'?s.every*k:12*s.every*k;const y=st.getFullYear(),m=st.getMonth()+mm,dim=new Date(y,m+1,0).getDate();d=new Date(y,m,Math.min(st.getDate(),dim))}const v=ymd(d);if(v>to||(s.until&&v>s.until))break;if(v>s.lastGen)out.push(v)}return out}

V.reports=()=>{if(isTech())return '';const pays=D.invoices.flatMap(i=>(i.payments||[]).map(p=>({...p,inv:i})));const bm={};pays.forEach(p=>{const m=(p.date||'').slice(0,7);bm[m]=(bm[m]||0)+(+p.amount||0)});

 const tc={};pays.forEach(p=>{tc[p.inv.client]=(tc[p.inv.client]||0)+(+p.amount||0)});const top=Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,10);
 const ar={cur:0,a30:0,a60:0,a90:0};const open=D.invoices.filter(i=>i.status!='Paid'&&i.status!='Draft'&&invT(i).bal>0);open.forEach(i=>{const late=i.due?Math.floor((new Date(tod())-new Date(i.due))/864e5):0,b=invT(i).bal;if(late<=0)ar.cur+=b;else if(late<=30)ar.a30+=b;else if(late<=60)ar.a60+=b;else ar.a90+=b});
 const max=Math.max(1,...Object.values(bm));const tbl=(h,rows)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.join('')||`<tr><td colspan=${h.length}>No data yet.</td></tr>`}</table></div>`;

 <div class="card"><h2>Revenue by month <small style="color:var(--m);font-weight:400;font-size:12px">payments received on invoices</small></h2>${tbl(['Month','Collected',''],Object.keys(bm).sort().reverse().map(m=>`<tr><td>${m}</td><td>${money(bm[m])}</td><td style="width:50%"><div style="background:var(--b);height:12px;border-radius:3px;width:${bm[m]/max*100}%"></div></td></tr>`))}</div>
 <div class="card"><h2>Outstanding A/R aging</h2>${tbl(['Current','1–30 days late','31–60','60+'],[`<tr><td>${money(ar.cur)}</td><td>${money(ar.a30)}</td><td>${money(ar.a60)}</td><td style="color:${ar.a90?'#c0392b':''}">${money(ar.a90)}</td></tr>`])}${tbl(['Invoice','Client','Due','Balance'],open.sort((a,b)=>(a.due||'').localeCompare(b.due||'')).map(i=>`<tr><td><a href="#" onclick="viewInvoice('${i.id}');return false">${esc(i.num)}</a></td><td>${cname(i.client)}</td><td>${i.due||''}</td><td>${money(invT(i).bal)}</td></tr>`))}</div>
 <div class="grid"><div class="card"><h2>Jobs by status</h2>${tbl(['Status','Jobs'],Object.entries(js).map(([s,n])=>`<tr><td><span class="pill ${s}">${s}</span></td><td>${n}</td></tr>`))}</div><div class="card"><h2>Hours by worker</h2>${tbl(['Worker','Last 30 days','All time'],hw.map(x=>`<tr><td>${esc(x.w.name)}</td><td>${x.m.toFixed(1)}</td><td>${x.all.toFixed(1)}</td></tr>`))}</div></div>

const LS=['New','Contacted','Quoted','Won','Lost'];
const openLeads=()=>D.leads.filter(l=>!['Won','Lost'].includes(l.status));
function notesBox(ref){const k=ref.jobId?'j':'q';return `<div style="margin-top:12px;border-top:1px solid var(--l);padding-top:10px" class="noprint"><h3 style="font-size:15px;margin:0 0 6px">📝 Customer notes</h3><div id="nlog"></div><textarea id="ntx" rows="2" placeholder="What did the customer say?" oninput="if(!window._ltouch)$('#nlead').checked=LEADKW.test(this.value);$('#nfu').style.display=$('#nlead').checked?'':'none'"></textarea>
 <div class="row" style="align-items:center;margin-top:4px"><label style="display:flex;gap:6px;align-items:center;color:var(--t);font-size:14px;margin:0"><input type="checkbox" id="nlead" style="width:22px;height:22px" onchange="window._ltouch=1;$('#nfu').style.display=this.checked?'':'none'"> Future work / lead</label><input id="nfu" type="date" title="Follow-up date" style="display:none;max-width:170px"><button class="btn sm" style="flex:0" onclick='addNote(${JSON.stringify(ref)})'>Add note</button></div></div>`}

 el.innerHTML=L.map(n=>`<div class="note"><div style="font-size:12px;color:var(--m)">${esc(n.byName||n.by)} · ${fmtDT(n.at)}${n.lead?' · <span class="pill New">lead</span>':''}</div><div style="white-space:pre-wrap">${esc(n.text)}</div></div>`).join('')||'<small style="color:var(--m)">No notes yet.</small>'}
function addNote(ref){const text=$('#ntx').value.trim();if(!text)return;const src=ref.jobId?J(ref.jobId):Q(ref.quoteId);const me=ME(),meName=W(myWorkerId())?.name||me||'Owner';const lead=$('#nlead').checked;
 const n={id:uid(),jobId:ref.jobId||'',quoteId:ref.quoteId||'',client:src?.client||'',clientName:(C(src?.client)||{}).name||src?.clientName||'',by:me,byName:meName,at:new Date().toISOString(),text,lead,techEmails:ref.jobId?(src?.techEmails||[]).slice():[]};D.notes.push(n);
 if(lead)D.leads.push({id:uid(),client:n.client,clientName:n.clientName,clientPhone:(C(n.client)||{}).phone||src?.clientPhone||'',text,job:n.jobId,quote:n.quoteId,note:n.id,date:tod(),follow:$('#nfu').value||'',status:'New',by:me,byName:meName});
 save();$('#ntx').value='';$('#nlead').checked=false;$('#nfu').style.display='none';drawNotes(ref);if(lead)setTimeout(()=>alert('Saved as a lead ✔'),10)}
{const _qd=quoteDoc;quoteDoc=function(q){let h=_qd(q);if(isOwner()){h=h.replace(/<div class="qv">/,`<div class="card noprint" id="qnotes">${notesBox({quoteId:q.id})}</div><div class="qv">`);setTimeout(()=>drawNotes({quoteId:q.id}),0)}return h}}
let lf='open';

 return `<div class="card"><div class="row" style="align-items:end"><div><label>Show</label><select onchange="lf=this.value;render()">${opt([['open','Open leads'],['','All'],...LS.map(s=>[s,s])],lf)}</select></div><div style="flex:2"><button class="btn" onclick="editLead()">+ New lead</button></div></div>${o?'':'<p style="font-size:13px;color:var(--m)">Leads you add go to the owners to follow up.</p>'}</div>
 ${L.map(l=>{const due=l.follow&&l.follow<=t&&!['Won','Lost'].includes(l.status);const j=J(l.job);return `<div class="card lead ${due?'due':''}"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div><b>${esc(l.clientName||cname(l.client))}</b>${l.clientPhone?` · <a href="tel:${esc(l.clientPhone)}">${esc(l.clientPhone)}</a>`:''}<div style="font-size:12px;color:var(--m)">${l.date}${j?' · from '+esc(j.num):''}${l.byName?' · by '+esc(l.byName):''}</div></div><span class="pill ${l.status}">${l.status}</span></div><div style="margin:8px 0;white-space:pre-wrap">${esc(l.text)}</div>
 ${o?`<div class="row" style="align-items:end"><div><label>Status</label><select onchange="setLead('${l.id}','status',this.value)">${opt(LS.map(s=>[s,s]),l.status)}</select></div><div><label>Follow up ${due?'<b style="color:#c0392b">· due</b>':''}</label><input type="date" value="${l.follow||''}" onchange="setLead('${l.id}','follow',this.value)"></div><div style="flex:0;white-space:nowrap">${l.quote&&Q(l.quote)?`<button class="btn s" onclick="viewQuote('${l.quote}')">Quote ${esc(Q(l.quote).num)}</button>`:`<button class="btn g" onclick="leadQuote('${l.id}')">Create quote</button>`}<button class="btn sm s" onclick="editLead('${l.id}')">Edit</button></div></div>`:''}</div>`}).join('')||'<div class="card">No leads here.</div>'}`};

 modal(`<h2>${id?'Edit':'New'} lead</h2>${o?clientPicker(l.client):`<label>Customer</label><select id="lcl">${opt(D.jobs.map(j=>[j.id,(j.clientName||'')+' ('+j.num+')']),'','— pick from my jobs —')}</select>`}<label>What do they want?</label><textarea id="ltx" rows="3">${esc(l.text)}</textarea><label>Follow-up date</label><input id="lfu" type="date" value="${l.follow||''}">

function calCell(day,h){if(isOwner())quickSched(day,h);else{cal.v='day';cal.d=day;render()}}
function quickSched(day,h){const un=D.jobs.filter(j=>!j.when&&!['Paid','Invoiced'].includes(j.status));const time=h!=null?String(h).padStart(2,'0')+':00':'08:00';

function weekText(wid,a){const w=W(wid);const L=D.jobs.filter(j=>(j.workers||[]).includes(wid)&&j.when&&j.when.slice(0,10)>=a&&j.when.slice(0,10)<addDays(a,7)).sort((x,y)=>x.when.localeCompare(y.when));const ord=n=>n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');
 return `${D.settings.company} schedule for ${w?w.name:''} (week of ${new Date(a+'T00:00').toLocaleDateString([],{month:'short',day:'numeric'})}):\n`+(L.map(j=>{const d=new Date(j.when);const c=C(j.client)||{};return `• ${d.toLocaleDateString([],{weekday:'long'})} the ${ord(d.getDate())}, ${fmtT(d)}: ${c.name||j.clientName||''}${(c.address||j.clientAddress)?' — '+(c.address||j.clientAddress):''}${j.desc?' ('+j.desc+')':''}`}).join('\n')||'No jobs scheduled.')}

const G_COMMON=[
['Getting started',['Open the app and sign in with your email and password. Tap "Forgot password" to get a reset email.','The 5 buttons along the bottom (or left side on a computer) take you to each part of the app.','Most screens have small tabs across the top, like Calendar / Jobs. Tap one to switch.','Not sure what something does? Hold your finger on it for a second (or point at it with the mouse) to see a tip. Tap a small (?) next to a box to see what goes in it.','Changes save to the cloud and show up on everyone\'s phone within seconds. A small dot in the header shows if you are synced.','Tap Sign out at the top when you are done on a shared device.']],
['Turning tips on or off',['Go to Help (the ? button at the top).','Use the "Show help tips" switch at the top of the guide.','The setting is remembered on this device only.']]];
const G_TECH=[...G_COMMON,
['Your Home screen',['Tap Home at the bottom.','"Today" shows the jobs you are assigned to today, in order.','Tap a job to open it and see the customer, address, phone and notes.']],
['Clocking in and out',['Tap Home, then Clock.','Tap Clock in when you start work.','Tap Clock out when you finish. Your hours are saved.','Forgot to clock in? Tell the owner so they can fix your hours.']],
['Seeing your hours',['Tap Home, then My hours.','Pick a week to see each day and your total hours.']],
['Your schedule',['Tap Schedule at the bottom. The calendar opens in Month view.','Days with dots have jobs. Tap a day to see its jobs listed below.','Use Week or Day to see more detail. Use ◀ and ▶ to move around, and Today to jump back.','Tap Jobs at the top to see a list of all your jobs.','You only see jobs you are assigned to.']],
['Working a job',['Open the job from Home or Schedule.','Tap the address to open Maps and get directions.','Tap the phone number to call the customer.','Read the Field notes for anything the office wants you to know.']],
['Customer info',['When you open one of your jobs you will see that customer\'s name, phone, email and address.','You only see customers for jobs you are assigned to.']],
['Taking job photos',['Open the job and tap the big 📷 Take photo button. The camera opens.','Pick a tag first: Before, During or After. During is picked for you while the job is In Progress.','Take as many as you like in a row.','To add pictures you already took, tap 🖼 Add from gallery and choose several.','Photos show in a timeline with the time and who took them.','You can delete photos you took.']],
['Checklists',['Open the job and scroll to Checklist.','Tap each step to check it off as you go.','The office sets up the list. If a step is missing, add a note.']],
['Writing notes and future work (leads)',['Open the job and type in the notes box what the customer said.','If they mention more work later (like "we want a new water heater next year"), turn on Future work / lead. The app may turn it on for you.','Tap Add note. It saves with your name and the time.','You can also tap Home, then Leads, then + New lead.','You will see the leads you wrote, and the office follows up on them.']]];
const G_OWNER=[...G_COMMON,
['Home screen',['Tap Home. "Today" shows today\'s jobs, money owed to you, overdue invoices, open leads and the profit summary.','The red number on Home means open leads waiting.']],
['Clocking in and out',['Tap Home, then Clock. Tap Clock in to start and Clock out to finish.','Owners can fix anyone\'s hours in Team, then Timesheets.']],
['Leads (future work)',['Tap Home, then Leads.','Tap + New lead, pick the customer, write what they want, and set a Follow-up date.','Leads show on the calendar as gold dashed "Lead" markers on their follow-up day. Red means overdue.','Change the status as you go: New, Contacted, Quoted, Won or Lost.','Tap Create quote to start a quote already filled in with the customer and note.']],
['Calendar',['Tap Schedule, then Calendar. It opens in Month view.','Tap a day to see its jobs below. Tap + Schedule job to book something on that day.','Drag a job (or lead) to another day to move it. On a phone, open it and tap Move.','Drag jobs from the Unscheduled list onto a day.','Use the worker filter to see one person\'s jobs. Colors match each worker.','Use the Leads switch to show or hide leads.','Tap 📤 Send schedule to text a worker their week.']],
['Jobs',['Tap Schedule, then Jobs. Tap + New job.','Pick the customer, describe the work, set the date and time, and pick the workers.','Set Repeat for jobs that come back, like a yearly water heater flush. Upcoming copies are made 60 days ahead.','Change the status as work goes: Scheduled, In Progress, Done, Paid.','Inside a job you can add notes, photos and a checklist, and enter the actual cost you paid for parts.','Tap Create invoice when the work is done.']],
['Photos and checklists',['Open a job and tap 📷 Take photo, or 🖼 Add from gallery. Tag Before, During or After.','Under Checklist, pick a saved checklist with Add, or add your own steps.','Make reusable checklists in More, then Price book & checklists.']],
['Quotes',['Tap Sales, then Quotes, then + New quote.','Pick the customer. Use "Start from template" to fill in parts and labor from a saved package. You can add more than one.','Use + Labor, + Part/material and + Service fee to add lines. Change qty and price as needed.','Your cost, profit and margin show at the bottom. Only owners see this, and it never prints.','Save it, then Print / Save PDF to give it to the customer.','When they say yes, set it to Approved and tap Convert to job.']],
['Invoices and payments',['Tap Sales, then Invoices, then + New invoice. Or tap Create invoice on a job or approved quote.','Invoice numbers (INV-1001...) are made for you. Due date defaults to 15 days.','Tap Mark sent when you give it to the customer. Past the due date it turns Overdue on its own.','Tap Record payment for cash, check or card. Partial payments are fine; the balance updates.','When fully paid it shows Paid and the job is marked Paid.','Tap Print / Save PDF to print or email it.']],
['Printing quotes and invoices',['Open the quote or invoice and tap Print / Save PDF.','In the print window, open More settings and turn off "Headers and footers" for a clean page.','Choose "Save as PDF" to email it instead of printing.','Address, license #, terms and payment methods come from Settings.']],
['Clients',['Tap Sales, then Clients. Tap + Add to add a customer with name, phone, email and address.','Tap a customer to see and edit their info.']],
['Price book (job templates)',['Tap More, then Price book & checklists.','Tap + New template. Name it (like "Water heater install - 50 gal gas"), add parts with qty, labor hours, trip fee and notes.','Use templates on new quotes with "Start from template".','Items named "Sample -" are examples. Delete them or use Clear sample data in Settings.']],
['Parts catalog',['Tap More, then Parts catalog. Add each part with your cost and either a sell price or markup %.','"Last cost paid" updates on its own when you enter an actual cost on a job.']],
['Profit and reports',['The Home screen shows profit by month and by job: Invoiced (billed), Collected (paid), cost and profit.','Draft invoices are not counted. Invoices with no part costs count as all profit, with a note.','Tap More, then Reports for revenue by month, quote win rate, jobs by status, hours by worker, top customers and money owed.','Costs and profit are only visible to owners.']],
['Workers and pay',['Tap Team, then Workers. Add each worker with a name, color and optional labor cost per hour.','Labor cost is used only for profit and is never shown to techs.']],
['Timesheets',['Tap Team, then Timesheets. Pick a week.','See everyone\'s hours. Tap + Manual entry to add missed hours, or tap an entry to fix it.','Tap Export CSV for a spreadsheet for payroll.']],
['Team logins and roles',['First add the person in Firebase Authentication (see SETUP.md) with their email and a password.','Then tap Team, then Logins, and add their name and email. Pick Role: Owner or Tech, and link them to their worker.','Techs see only their own jobs, those customers, photos, checklists, leads they write and their own hours. They never see costs, prices you pay, profit, invoices, reports, settings or pay.','Remove a login to take away access.']],
['Messages and call notes',['Tap More, then Messages & call notes. Tap + New note to save a phone call summary.','Use ## for a heading, - for a bullet, and **text** for bold.']],
['Settings',['Tap More, then Settings & backup.','Set company name, phone, tax %, labor rate, address, email, license #, how long quotes are valid, terms and payment methods.','Everything here prints on quotes and invoices.']],
['Backups',['In Settings, tap Export JSON backup now and then and keep the file safe.','Import backup loads a backup file and replaces current data.','Erase everything deletes all data; only use it after making a backup.']]];
let helpQ='';
V.help=()=>{const g=isOwner()?G_OWNER:G_TECH;return `<div class="card helphead"><h2>${isOwner()?'Owner guide':'Tech guide'}</h2><p style="color:var(--m);margin:4px 0 10px">Step-by-step help for everything you can do in the app. Tap a section to open it.</p>
 <input id="helpq" type="search" placeholder="Search help (e.g. ${isOwner()?'invoice, ':''}photo, clock)" value="${esc(helpQ)}" oninput="helpQ=this.value;helpFilter()">
 <label class="tiptog"><input type="checkbox" ${tipsOn?'checked':''} onchange="setTips(this.checked)"> Show help tips (hover or press and hold)</label></div>
 <div id="helplist">${g.map(([t,st],i)=>`<details class="card hsec"><summary data-tip="Tap to open or close this section.">${esc(t)}</summary><ol>${st.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></details>`).join('')}<div class="card" id="helpnone" style="display:none;color:var(--m)">No matching help. Try another word.</div></div>`};
function helpFilter(){const q=helpQ.trim().toLowerCase();let n=0;document.querySelectorAll('.hsec').forEach(d=>{const m=!q||d.textContent.toLowerCase().includes(q);d.style.display=m?'':'none';if(m)n++;d.open=!!q&&m;d.querySelectorAll('li').forEach(li=>li.classList.toggle('hit',!!q&&li.textContent.toLowerCase().includes(q)))});$('#helpnone').style.display=n?'none':''}
TECH_TABS.push('help');MORE.push(['help','Help & how-to guide','❓']);
document.querySelector('header').insertAdjacentHTML('beforeend','<button class="btn s sm noprint" id="helpbtn" onclick="go(\'help\')" aria-label="Help">? Help</button>');
{const _r=render;render=function(){_r();if(tab=='help'&&!isOwner())document.querySelector('#app .subbar')?.remove();if(tab=='help'&&helpQ)helpFilter();applyTips()}}
{const _vs=V.settings;V.settings=()=>`<div class="card"><h2>Help tips</h2><label class="tiptog"><input type="checkbox" ${tipsOn?'checked':''} onchange="setTips(this.checked)"> Show help tips on buttons and fields (this device)</label></div>`+_vs()}
render();
</script>
<script type="module">
/* ================================================================
   FIREBASE CONFIG — paste your config from Firebase Console here
   (Project settings > General > Your apps > Web app > SDK setup)
   ================================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyAka3SYqrDLxlxRIul4z1rzLW2M3BNrqyg",
  authDomain: "plumbing-ops.firebaseapp.com",
  projectId: "plumbing-ops",
  storageBucket: "plumbing-ops.firebasestorage.app",
  messagingSenderId: "666842819764",
  appId: "1:666842819764:web:9ddcad8fb444159854bbe1"
};
/* ================================================================ */
const COMPANY='main';
// D key -> Firestore collection. priv = fields moved to an owner-only "<collection>_private" doc
const SPEC={clients:{c:'clients'},workers:{c:'workers',priv:['rate','cost']},jobs:{c:'jobs',priv:['actual']},quotes:{c:'quotes'},time:{c:'timeEntries'},parts:{c:'parts'},templates:{c:'templates'},invoices:{c:'invoices'},recurring:{c:'recurring'},checklistTemplates:{c:'checklistTemplates'},users:{c:'users'},notes:{c:'notes'},leads:{c:'leads'},messages:{c:'messages'}};
// what techs may write: collection -> owner field that must equal their email, and whether they may delete
const TECHW={time:{f:'email',del:false},notes:{f:'by',del:false},leads:{f:'by',del:false}};
const SCHEMA=2;
const $=s=>document.querySelector(s), body=$('#authbody'), st=$('#syncst');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(firebaseConfig.apiKey.startsWith('PASTE')){
  body.innerHTML=`<p><b>Live sync is not configured yet.</b></p><p style="color:var(--m);font-size:14px">Paste your Firebase config into <code>index.html</code> (see SETUP.md). Until then you can keep using the app on this device only.</p><button class="btn" id="offline">Use offline on this device</button>`;
  $('#offline').onclick=()=>{$('#auth').style.display='none'};
} else start().catch(e=>{body.innerHTML=`<p class="amsg">Could not load sync: ${esc(e.message)}</p><button class="btn" onclick="location.reload()">Retry</button>`});

async function start(){
  const V='10.12.2', base=`https://www.gstatic.com/firebasejs/${V}/`;
  const {initializeApp}=await import(base+'firebase-app.js');
  const A=await import(base+'firebase-auth.js');
  const F=await import(base+'firebase-firestore.js');
  const app=initializeApp(firebaseConfig), auth=A.getAuth(app);
  let db; try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){db=F.getFirestore(app)}
  const co=F.doc(db,'companies',COMPANY), metaRef=F.doc(co,'settings','main'), pubRef=F.doc(co,'settings','public');
  let unsubs=[], last={}, applying=false, ready=false, role=null, me='';
  const pubM={}, privM={};

  function showLogin(msg='',ok=false){
    $('#auth').style.display='flex';$('#signout').style.display='none';st.textContent='';
    body.innerHTML=`<label>Email</label><input id="ae" type="email" autocomplete="username"><label>Password</label><input id="ap" type="password" autocomplete="current-password"><div style="margin-top:14px"><button class="btn" id="ain">Sign in</button></div><div style="margin-top:10px"><a id="areset">Forgot password? Send reset email</a></div><div class="amsg ${ok?'ok':''}" id="amsg">${esc(msg)}</div>`;
    const go=async()=>{try{$('#amsg').textContent='Signing in…';await A.signInWithEmailAndPassword(auth,$('#ae').value.trim(),$('#ap').value)}catch(e){$('#amsg').className='amsg';$('#amsg').textContent=nice(e)}};
    $('#ain').onclick=go;$('#ap').onkeydown=e=>{if(e.key=='Enter')go()};
    $('#areset').onclick=async()=>{const e=$('#ae').value.trim();if(!e){$('#amsg').textContent='Type your email above first.';return}
      try{await A.sendPasswordResetEmail(auth,e);$('#amsg').className='amsg ok';$('#amsg').textContent='Reset email sent — check your inbox.'}catch(x){$('#amsg').textContent=nice(x)}};
  }
  const nice=e=>({'auth/invalid-credential':'Wrong email or password.','auth/wrong-password':'Wrong email or password.','auth/user-not-found':'No account with that email.','auth/invalid-email':'That email looks wrong.','auth/too-many-requests':'Too many tries — wait a bit and try again.','permission-denied':'This account is not allowed to do that.'}[e.code]||e.message);
  $('#signout').onclick=async()=>{await A.signOut(auth);localStorage.removeItem(K);setD(norm(blank()));window.photoStore=window.localPhotoStore;render()};

  const stable=o=>JSON.stringify(o,(k,v)=>v&&typeof v=='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
  const clean=o=>JSON.parse(JSON.stringify(o)); // strips undefined (Firestore rejects it)
  const meta=D=>({settings:D.settings,seq:D.seq,schema:SCHEMA});
  const split=(k,x)=>{const p=SPEC[k].priv;if(!p)return[clean(x),null];const a={},b={};for(const f in x)(p.includes(f)?b:a)[f]=x[f];return[clean(a),clean(b)]};
  const snapLast=D=>{last={};for(const k in SPEC){last[k]={};(D[k]||[]).forEach(x=>last[k][x.id]=stable(x))}last.meta=stable(meta(D))};

  async function commit(ops){for(let i=0;i<ops.length;i+=400){const wb=F.writeBatch(db);ops.slice(i,i+400).forEach(([t,r,v])=>t=='set'?wb.set(r,v):t=='upd'?wb.update(r,v):wb.delete(r));
    try{await wb.commit()}catch(e){st.textContent='⚠ sync error';alert('Sync error: '+nice(e))}}}

  // Push only what changed since last sync
  async function push(full=false){
    if(applying||!ready&&!full)return;const D=getD();const ops=[];
    if(role==='owner'){
      for(const k in SPEC){const c=SPEC[k].c,prev=full?{}:(last[k]||{}),cur={};
        (D[k]||[]).forEach(x=>{if(!x.id)return;const s=stable(x);cur[x.id]=s;if(prev[x.id]!==s){const [a,b]=split(k,x);ops.push(['set',F.doc(co,c,x.id),a]);if(b)ops.push(['set',F.doc(co,c+'_private',x.id),b])}});
        for(const id in prev)if(!(id in cur)){ops.push(['del',F.doc(co,c,id)]);if(SPEC[k].priv)ops.push(['del',F.doc(co,c+'_private',id)])}
        last[k]=cur}
      const m=stable(meta(D));if(full||m!==last.meta){ops.push(['set',metaRef,clean(meta(D))]);const S=D.settings;ops.push(['set',pubRef,clean({company:S.company||'',phone:S.phone||''})])}last.meta=m;
    }else if(role==='tech'){
      for(const k in TECHW){const {f,del}=TECHW[k],c=SPEC[k].c,pt=last[k]||{},cur={};(D[k]||[]).forEach(t=>{const s=stable(t);cur[t.id]=s;if(pt[t.id]!==s&&t[f]===me)ops.push(['set',F.doc(co,c,t.id),clean(t)])});
        if(del)for(const id in pt)if(!(id in cur)&&JSON.parse(pt[id])[f]===me)ops.push(['del',F.doc(co,c,id)]);last[k]=cur}
      const pj=last.jobs||{},cj={};(D.jobs||[]).forEach(j=>{const s=stable(j);cj[j.id]=s;if(pj[j.id]&&pj[j.id]!==s){const o=JSON.parse(pj[j.id]);if(stable(o.techNotes)!==stable(j.techNotes)||stable(o.checklist)!==stable(j.checklist))ops.push(['upd',F.doc(co,'jobs',j.id),{techNotes:j.techNotes||'',checklist:clean(j.checklist||[]),updatedBy:me}])}});last.jobs=cj;
    }
    await commit(ops);
  }
  window.cloudSave=()=>push();

  function compose(k){const D=getD();D[k]=Object.keys(pubM[k]||{}).map(id=>Object.assign({},pubM[k][id],(privM[k]||{})[id]||{}));last[k]={};D[k].forEach(x=>last[k][x.id]=stable(x));return D}
  function listenCol(k,q,isPriv){unsubs.push(F.onSnapshot(q,{includeMetadataChanges:true},s=>{const M={};s.docs.forEach(d=>M[d.id]=d.data());(isPriv?privM:pubM)[k]=M;apply(compose(k),s)},err))}
  function listen(){
    unsubs.forEach(u=>u());unsubs=[];
    if(role==='owner'){
      for(const k in SPEC){listenCol(k,F.collection(co,SPEC[k].c));if(SPEC[k].priv)listenCol(k,F.collection(co,SPEC[k].c+'_private'),true)}
      unsubs.push(F.onSnapshot(metaRef,{includeMetadataChanges:true},s=>{if(!s.exists())return;const D=getD(),m=s.data();if(m.settings)D.settings=m.settings;if(m.seq)D.seq=Object.assign({i:1001},m.seq);last.meta=stable(meta(D));apply(D,s)},err));
    }else{
      listenCol('workers',F.collection(co,'workers'));
      listenCol('jobs',F.query(F.collection(co,'jobs'),F.where('techEmails','array-contains',me)));
      listenCol('time',F.query(F.collection(co,'timeEntries'),F.where('email','==',me)));
      listenCol('checklistTemplates',F.collection(co,'checklistTemplates'));
      listenCol('notes',F.query(F.collection(co,'notes'),F.where('techEmails','array-contains',me)));
      listenCol('leads',F.query(F.collection(co,'leads'),F.where('by','==',me)));
      unsubs.push(F.onSnapshot(pubRef,s=>{if(!s.exists())return;const D=getD();Object.assign(D.settings,s.data());apply(D,s)},err));
    }
  }
  function apply(D,s){applying=true;setD(D);applying=false;st.textContent=s.metadata.fromCache?'● offline (cached)':(s.metadata.hasPendingWrites?'● syncing…':'● live');rerender();$('#cname').innerHTML='<img src="logo-mono-white.png" alt="" class="hlogo">'+esc(!D.settings.company||D.settings.company=='Your Plumbing Co.'?'Central Plumbing':D.settings.company)}
  function err(e){st.textContent='⚠ '+nice(e);console.warn(e);if(e.code=='permission-denied'&&role!=='owner'){alert('Access problem: '+nice(e));A.signOut(auth)}}

  // Firestore-backed photo store: photos/{id} (meta) + photos/{id}/chunks/{n} (base64 pieces < 1MB each)
  const CH=700000;
  const fsPhotos={
    async list(jid){const c=F.collection(co,'photos');const q=role==='owner'?F.query(c,F.where('jobId','==',jid)):F.query(c,F.where('jobId','==',jid),F.where('techEmails','array-contains',me));return (await F.getDocs(q)).docs.map(d=>({id:d.id,...d.data()}))},
    async get(p){const s=await F.getDocs(F.collection(co,'photos',p.id,'chunks'));return s.docs.sort((a,b)=>+a.id-+b.id).map(d=>d.data().d).join('')},
    async add(j,tag,data){const id=Math.random().toString(36).slice(2,12),n=Math.ceil(data.length/CH),wb=F.writeBatch(db),te=(j.techEmails||[]).slice();if(role!=='owner'&&!te.includes(me))te.push(me);
      wb.set(F.doc(co,'photos',id),{jobId:j.id,tag,by:me,byName:(window.phName?phName():me),at:new Date().toISOString(),n,techEmails:te});for(let i=0;i<n;i++)wb.set(F.doc(co,'photos',id,'chunks',String(i)),{d:data.slice(i*CH,(i+1)*CH)});await wb.commit();return {id}},
    async del(p){const wb=F.writeBatch(db);for(let i=0;i<(p.n||1);i++)wb.delete(F.doc(co,'photos',p.id,'chunks',String(i)));wb.delete(F.doc(co,'photos',p.id));await wb.commit()}
  };

  async function loadAllOwner(){const D=norm(blank());let any=false;
    for(const k in SPEC){const pub=await F.getDocs(F.collection(co,SPEC[k].c));let priv={};if(SPEC[k].priv){(await F.getDocs(F.collection(co,SPEC[k].c+'_private'))).docs.forEach(d=>priv[d.id]=d.data())}
      D[k]=pub.docs.map(d=>Object.assign({},d.data(),priv[d.id]||{}));if(pub.size)any=true}
    const ms=await F.getDoc(metaRef);if(ms.exists()){any=true;const m=ms.data();if(m.settings)D.settings=m.settings;if(m.seq)D.seq=Object.assign({i:1001},m.seq)}
    return {D,empty:!any,schema:ms.exists()?(ms.data().schema||1):0}}

  A.onAuthStateChanged(auth,async u=>{
    unsubs.forEach(x=>x());unsubs=[];ready=false;role=null;
    window.userEmail=u?u.email:null;window.userRole=null;window.userWorkerId=null;
    if(!u){window.photoStore=window.localPhotoStore;showLogin();return}
    me=u.email.toLowerCase();body.innerHTML='<p style="color:var(--m)">Loading company data…</p>';
    try{
      let workerId=null;if((window.OWNER_LIST||[]).includes(me))role='owner';
      try{const ud=await F.getDoc(F.doc(co,'users',me));if(ud.exists()){const x=ud.data();if(!role)role=x.role==='owner'?'owner':'tech';workerId=x.workerId||null}}catch(e){if(!role)throw e}
      if(!role){showLogin('This account ('+u.email+') is not on the team. Ask an owner to add you in Team.');await A.signOut(auth);return}
      window.userRole=role;window.userWorkerId=workerId;window.photoStore=fsPhotos;
      if(role==='owner'){
        const r=await loadAllOwner();
        if(r.empty){const D=getD(),n=Object.keys(SPEC).reduce((a,k)=>a+(D[k]||[]).filter(x=>!x.sample).length,0);
          if(n&&!confirm(`The shared company account is empty.\n\nUpload the ${n} record(s) saved on this device so everyone can see them?\n\nOK = upload  ·  Cancel = start fresh`)){const b=norm(blank());b.settings=D.settings;setD(b)}
          derive();await push(true);
        }else{setD(r.D);snapLast(getD());derive();
          if(r.schema<SCHEMA){st.textContent='● upgrading data…';await push(true)} // migration: split private fields out of public docs, add techEmails etc.
        }
        ready=true;await push();window.onDataReady&&window.onDataReady();
      }else{setD(norm(blank()));ready=true}
      listen();window.onUserChange&&window.onUserChange();
      $('#auth').style.display='none';$('#signout').style.display='';$('#signout').title=u.email+' ('+role+')';
    }catch(e){console.warn(e);if(e.code=='permission-denied'){showLogin('This account ('+u.email+') is not allowed to access company data.');A.signOut(auth)}else showLogin('Error: '+nice(e))}
  });
}
</script></body></html>
